name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  link-check:
    name: Check internal Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every relative link resolves
        run: python3 scripts/check_links.py

      - name: Check every SVG diagram is well-formed
        run: python3 scripts/check_svgs.py

      - name: Check every chapter follows the template and learner aids
        run: python3 scripts/check_chapters.py

  docs-build:
    name: Build the docs site (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

  examples-compile:
    name: Byte-compile examples/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every example's Python files
        run: python3 scripts/check_examples_compile.py

  markdown-lint:
    name: Lint Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !**/node_modules/**
        continue-on-error: true
