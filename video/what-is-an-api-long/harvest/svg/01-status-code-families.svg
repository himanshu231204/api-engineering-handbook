<svg fill="#FFFFFF" xmlns="http://www.w3.org/2000/svg" width="880" height="462" viewBox="0 0 880 462" role="img" aria-labelledby="r01-status-code-families-t r01-status-code-families-d">
  <title id="r01-status-code-families-t">HTTP status code families</title>
  <desc id="r01-status-code-families-d">Five bands of status codes: 1xx informational, 2xx success, 3xx redirection, 4xx client error and 5xx server error, with who is at fault and common codes for each.</desc>
  <defs>
    <marker id="r01-status-code-families-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8199BB"/>
    </marker>
    <style>
      .r01-status-code-families-title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r01-status-code-families-sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r01-status-code-families-h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r01-status-code-families-lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .r01-status-code-families-note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r01-status-code-families-code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- canvas -->
  <text x="32" y="44" class="r01-status-code-families-title">HTTP status code families</text>
  <text x="32" y="66" class="r01-status-code-families-sub">The first digit tells you whose move it is, and whether a retry can help.</text>
  <rect x="32" y="84" width="816" height="64" rx="10" fill="#111C27" stroke="#648BC4" stroke-width="1.5"/>
  <text x="48" y="116" style="font: 700 22px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#A0A0B0;">1xx</text>
  <text x="48" y="136" class="r01-status-code-families-lbl" style="fill:#A0A0B0">Informational</text>
  <text x="170" y="110" class="r01-status-code-families-note">Who is at fault?</text>
  <text x="170" y="130" class="r01-status-code-families-lbl">Nobody: in progress</text>
  <line x1="350" y1="94" x2="350" y2="138" stroke="#648BC4" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="370" y="112" class="r01-status-code-families-code">100 Continue · 101 Switching Protocols</text>
  <text x="370" y="132" class="r01-status-code-families-note">Rare in API code; wait for the final response</text>
  <rect x="32" y="156" width="816" height="64" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="1.5"/>
  <text x="48" y="188" style="font: 700 22px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#69DDAD;">2xx</text>
  <text x="48" y="208" class="r01-status-code-families-lbl" style="fill:#69DDAD">Success</text>
  <text x="170" y="182" class="r01-status-code-families-note">Who is at fault?</text>
  <text x="170" y="202" class="r01-status-code-families-lbl">Nobody: it worked</text>
  <line x1="350" y1="166" x2="350" y2="210" stroke="#50D89F" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="370" y="184" class="r01-status-code-families-code">200 OK · 201 Created · 204 No Content</text>
  <text x="370" y="204" class="r01-status-code-families-note">Use the result; no retry needed</text>
  <rect x="32" y="228" width="816" height="64" rx="10" fill="#081A30" stroke="#3B73ED" stroke-width="1.5"/>
  <text x="48" y="260" style="font: 700 22px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#5787F0;">3xx</text>
  <text x="48" y="280" class="r01-status-code-families-lbl" style="fill:#5787F0">Redirection</text>
  <text x="170" y="254" class="r01-status-code-families-note">Who is at fault?</text>
  <text x="170" y="274" class="r01-status-code-families-lbl">Nobody: it moved</text>
  <line x1="350" y1="238" x2="350" y2="282" stroke="#3B73ED" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="370" y="256" class="r01-status-code-families-code">301 Moved Permanently · 304 Not Modified</text>
  <text x="370" y="276" class="r01-status-code-families-note">Follow Location, or reuse your cached copy</text>
  <rect x="32" y="300" width="816" height="64" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <text x="48" y="332" style="font: 700 22px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#F69850;">4xx</text>
  <text x="48" y="352" class="r01-status-code-families-lbl" style="fill:#F69850">Client error</text>
  <text x="170" y="326" class="r01-status-code-families-note">Who is at fault?</text>
  <text x="170" y="346" class="r01-status-code-families-lbl">The client</text>
  <line x1="350" y1="310" x2="350" y2="354" stroke="#F58733" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="370" y="328" class="r01-status-code-families-code">400 · 401 · 403 · 404 · 422 · 429</text>
  <text x="370" y="348" class="r01-status-code-families-note">Fix the request; retrying unchanged will not help</text>
  <rect x="32" y="372" width="816" height="64" rx="10" fill="#300808" stroke="#E34545" stroke-width="1.5"/>
  <text x="48" y="404" style="font: 700 22px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#E76060;">5xx</text>
  <text x="48" y="424" class="r01-status-code-families-lbl" style="fill:#E76060">Server error</text>
  <text x="170" y="398" class="r01-status-code-families-note">Who is at fault?</text>
  <text x="170" y="418" class="r01-status-code-families-lbl">The server</text>
  <line x1="350" y1="382" x2="350" y2="426" stroke="#E34545" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="370" y="400" class="r01-status-code-families-code">500 Internal · 502 · 503 · 504</text>
  <text x="370" y="420" class="r01-status-code-families-note">Retry later with backoff; alert on-call</text>
</svg>
