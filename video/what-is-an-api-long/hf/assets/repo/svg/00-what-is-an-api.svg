<svg fill="#FFFFFF" xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-labelledby="r00-what-is-an-api-t r00-what-is-an-api-d">
  <title id="r00-what-is-an-api-t">What an API is</title>
  <desc id="r00-what-is-an-api-d">A client app talks to a server only through an API contract, like a diner using a menu and a waiter. The kitchen behind it can change freely as long as the contract holds.</desc>
  <defs>
    <marker id="r00-what-is-an-api-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8199BB"/>
    </marker>
    <style>
      .r00-what-is-an-api-title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r00-what-is-an-api-sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r00-what-is-an-api-h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r00-what-is-an-api-lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .r00-what-is-an-api-note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r00-what-is-an-api-code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- canvas -->
  <text x="32" y="44" class="r00-what-is-an-api-title">An API is a contract in the middle</text>
  <text x="32" y="66" class="r00-what-is-an-api-sub">The client only depends on the menu. Everything behind it can change.</text>
  <rect x="32" y="96" width="208" height="156" rx="10" fill="#081A30" stroke="#3B73ED" stroke-width="1.5"/>
  <text x="48" y="126" class="r00-what-is-an-api-h">Client app</text>
  <text x="48" y="152" class="r00-what-is-an-api-note">phone app, browser,</text>
  <text x="48" y="170" class="r00-what-is-an-api-note">script or AI agent</text>
  <text x="48" y="208" class="r00-what-is-an-api-note">Asks. Never sees</text>
  <text x="48" y="226" class="r00-what-is-an-api-note">how the answer is made.</text>
  <rect x="336" y="96" width="208" height="156" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="2.5"/>
  <text x="352" y="126" class="r00-what-is-an-api-h">API contract</text>
  <text x="352" y="158" class="r00-what-is-an-api-code">GET /users/42</text>
  <text x="352" y="180" class="r00-what-is-an-api-code">200 + JSON body</text>
  <text x="352" y="214" class="r00-what-is-an-api-note">the menu: exactly what</text>
  <text x="352" y="232" class="r00-what-is-an-api-note">you may ask and get back</text>
  <rect x="640" y="96" width="208" height="156" rx="10" fill="#111C27" stroke="#648BC4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="656" y="126" class="r00-what-is-an-api-h">Server + data</text>
  <text x="656" y="152" class="r00-what-is-an-api-note">business logic, database</text>
  <text x="656" y="170" class="r00-what-is-an-api-note">other services</text>
  <text x="656" y="208" class="r00-what-is-an-api-note">Hidden from the client:</text>
  <text x="656" y="226" class="r00-what-is-an-api-note">free to change inside.</text>
  <line x1="240" y1="152" x2="336" y2="152" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r00-what-is-an-api-arrow)"/>
  <line x1="544" y1="152" x2="640" y2="152" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r00-what-is-an-api-arrow)"/>
  <line x1="640" y1="196" x2="544" y2="196" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r00-what-is-an-api-arrow)"/>
  <line x1="336" y1="196" x2="240" y2="196" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r00-what-is-an-api-arrow)"/>
  <text x="288" y="142" class="r00-what-is-an-api-note" text-anchor="middle">request</text>
  <text x="592" y="142" class="r00-what-is-an-api-note" text-anchor="middle">request</text>
  <text x="288" y="216" class="r00-what-is-an-api-note" text-anchor="middle">response</text>
  <text x="592" y="216" class="r00-what-is-an-api-note" text-anchor="middle">response</text>
  <line x1="46" y1="266" x2="226" y2="266" stroke="#3B73ED" stroke-width="2"/>
  <text x="136" y="288" class="r00-what-is-an-api-lbl" text-anchor="middle" style="fill:#5787F0">The diner</text>
  <line x1="350" y1="266" x2="530" y2="266" stroke="#50D89F" stroke-width="2"/>
  <text x="440" y="288" class="r00-what-is-an-api-lbl" text-anchor="middle" style="fill:#69DDAD">Menu + waiter</text>
  <line x1="654" y1="266" x2="834" y2="266" stroke="#648BC4" stroke-width="2"/>
  <text x="744" y="288" class="r00-what-is-an-api-lbl" text-anchor="middle" style="fill:#A0A0B0">The kitchen</text>
  <rect x="32" y="308" width="816" height="44" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <text x="440" y="335" class="r00-what-is-an-api-note" text-anchor="middle">Swap the chefs, the stove or the recipe: if the dish still matches the menu, the client never notices.</text>
</svg>
