<svg fill="#FFFFFF" xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="r01-http-request-anatomy-t r01-http-request-anatomy-d">
  <title id="r01-http-request-anatomy-t">Anatomy of an HTTP request and response</title>
  <desc id="r01-http-request-anatomy-d">An HTTP request has a request line, headers, a blank line and an optional body. The response mirrors it with a status line, headers, a blank line and a body.</desc>
  <defs>
    <marker id="r01-http-request-anatomy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8199BB"/>
    </marker>
    <style>
      .r01-http-request-anatomy-title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r01-http-request-anatomy-sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r01-http-request-anatomy-h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r01-http-request-anatomy-lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .r01-http-request-anatomy-note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r01-http-request-anatomy-code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- canvas -->
  <text x="32" y="44" class="r01-http-request-anatomy-title">Anatomy of an HTTP message</text>
  <text x="32" y="66" class="r01-http-request-anatomy-sub">Requests and responses share the same 4-part shape. Read top to bottom.</text>

  <!-- ===== REQUEST (left) ===== -->
  <text x="32" y="104" class="r01-http-request-anatomy-h">Client → Server: Request</text>
  <!-- start line -->
  <rect x="32" y="116" width="380" height="44" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="1.5"/>
  <text x="48" y="143" class="r01-http-request-anatomy-code">POST /orders HTTP/1.1</text>
  <!-- headers -->
  <rect x="32" y="170" width="380" height="96" rx="10" fill="#081A30" stroke="#3B73ED" stroke-width="1.5"/>
  <text x="48" y="196" class="r01-http-request-anatomy-code">Host: api.shop.com</text>
  <text x="48" y="220" class="r01-http-request-anatomy-code">Content-Type: application/json</text>
  <text x="48" y="244" class="r01-http-request-anatomy-code">Authorization: Bearer eyJhb…</text>
  <!-- blank line -->
  <rect x="32" y="276" width="380" height="26" rx="8" fill="#111C27" stroke="#C4D4E8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="48" y="294" class="r01-http-request-anatomy-note">(empty line — “headers are done”)</text>
  <!-- body -->
  <rect x="32" y="312" width="380" height="60" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <text x="48" y="338" class="r01-http-request-anatomy-code">{"item": "book", "qty": 2}</text>
  <text x="48" y="358" class="r01-http-request-anatomy-note">optional — GET usually has none</text>

  <!-- ===== RESPONSE (right) ===== -->
  <text x="468" y="104" class="r01-http-request-anatomy-h">Server → Client: Response</text>
  <rect x="468" y="116" width="380" height="44" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="1.5"/>
  <text x="484" y="143" class="r01-http-request-anatomy-code">HTTP/1.1 201 Created</text>
  <rect x="468" y="170" width="380" height="96" rx="10" fill="#081A30" stroke="#3B73ED" stroke-width="1.5"/>
  <text x="484" y="196" class="r01-http-request-anatomy-code">Content-Type: application/json</text>
  <text x="484" y="220" class="r01-http-request-anatomy-code">Location: /orders/42</text>
  <text x="484" y="244" class="r01-http-request-anatomy-code">Cache-Control: no-store</text>
  <rect x="468" y="276" width="380" height="26" rx="8" fill="#111C27" stroke="#C4D4E8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="484" y="294" class="r01-http-request-anatomy-note">(empty line)</text>
  <rect x="468" y="312" width="380" height="60" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <text x="484" y="338" class="r01-http-request-anatomy-code">{"id": 42, "status": "pending"}</text>
  <text x="484" y="358" class="r01-http-request-anatomy-note">the data you asked for</text>

  <!-- arrow between -->
  <line x1="414" y1="242" x2="464" y2="242" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r01-http-request-anatomy-arrow)"/>

  <!-- legend -->
  <g transform="translate(32,398)">
    <rect width="816" height="48" rx="10" fill="#111C27" stroke="#2A2A2A"/>
    <rect x="16" y="16" width="16" height="16" rx="4" fill="#11271B" stroke="#50D89F"/>
    <text x="40" y="29" class="r01-http-request-anatomy-lbl" fill="#69DDAD">Start line</text>
    <text x="118" y="29" class="r01-http-request-anatomy-note">what &amp; where / what happened</text>
    <rect x="320" y="16" width="16" height="16" rx="4" fill="#081A30" stroke="#3B73ED"/>
    <text x="344" y="29" class="r01-http-request-anatomy-lbl" fill="#5787F0">Headers</text>
    <text x="406" y="29" class="r01-http-request-anatomy-note">metadata (key: value)</text>
    <rect x="580" y="16" width="16" height="16" rx="4" fill="#302808" stroke="#F58733"/>
    <text x="604" y="29" class="r01-http-request-anatomy-lbl" fill="#F69850">Body</text>
    <text x="646" y="29" class="r01-http-request-anatomy-note">the actual payload</text>
  </g>
</svg>
