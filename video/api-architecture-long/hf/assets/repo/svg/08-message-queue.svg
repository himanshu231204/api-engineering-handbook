<svg fill="#FFFFFF" xmlns="http://www.w3.org/2000/svg" width="880" height="512" viewBox="0 0 880 512" role="img" aria-labelledby="r08-message-queue-t r08-message-queue-d">
  <title id="r08-message-queue-t">Message queue with workers, acknowledgements, retries and a dead-letter queue</title>
  <desc id="r08-message-queue-d">The client posts a request; the API publishes a small message to a durable queue and returns 202 Accepted within about 20 ms. Workers pull messages, do the slow work and acknowledge only after success. A worker that crashes before acknowledging causes the message to be redelivered. After too many failed attempts a message moves to a dead-letter queue for a human to inspect.</desc>
  <defs>
    <marker id="r08-message-queue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8199BB"/>
    </marker>
    <style>
      .r08-message-queue-title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r08-message-queue-sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r08-message-queue-h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r08-message-queue-lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .r08-message-queue-note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r08-message-queue-code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- canvas -->
  <text x="32" y="44" class="r08-message-queue-title">Message queue: answer fast, work later, never lose the job</text>
  <text x="32" y="66" class="r08-message-queue-sub">The API only records the job. Separate workers do the slow part at their own pace and survive crashes.</text>
  <rect x="32" y="112" width="140" height="64" rx="10" fill="#081A30" stroke="#3B73ED" stroke-width="1.5"/>
  <text x="102" y="140" class="r08-message-queue-lbl" fill="#5787F0" text-anchor="middle">Client</text>
  <text x="102" y="160" class="r08-message-queue-note" text-anchor="middle">browser or app</text>
  <rect x="232" y="112" width="160" height="64" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="1.5"/>
  <text x="312" y="140" class="r08-message-queue-lbl" fill="#69DDAD" text-anchor="middle">API (producer)</text>
  <text x="312" y="160" class="r08-message-queue-note" text-anchor="middle">validates, enqueues</text>
  <line x1="174" y1="132" x2="230" y2="132" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r08-message-queue-arrow)"/>
  <circle cx="202" cy="112" r="12" fill="#61DBA8"/>
  <text x="202" y="116.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">1</text>
  <line x1="230" y1="160" x2="174" y2="160" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r08-message-queue-arrow)"/>
  <rect x="32" y="190" width="360" height="52" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="1.5"/>
  <circle cx="54" cy="216" r="12" fill="#61DBA8"/>
  <text x="54" y="220.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">3</text>
  <text x="74" y="212" class="r08-message-queue-code">202 Accepted</text>
  <text x="74" y="232" class="r08-message-queue-note">client has its answer in ~20 ms; work is queued</text>
  <rect x="448" y="104" width="200" height="120" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <text x="548.0" y="128" class="r08-message-queue-lbl" fill="#F69850" text-anchor="middle">Message queue</text>
  <text x="548.0" y="146" class="r08-message-queue-note" text-anchor="middle">durable: written to disk</text>
  <rect x="464" y="160" width="29" height="26" rx="5" fill="#0B0B0F" stroke="#F58733" stroke-width="1.2"/>
  <rect x="499" y="160" width="29" height="26" rx="5" fill="#0B0B0F" stroke="#F58733" stroke-width="1.2"/>
  <rect x="534" y="160" width="29" height="26" rx="5" fill="#0B0B0F" stroke="#F58733" stroke-width="1.2"/>
  <rect x="569" y="160" width="29" height="26" rx="5" fill="#0B0B0F" stroke="#F58733" stroke-width="1.2"/>
  <rect x="604" y="160" width="29" height="26" rx="5" fill="#0B0B0F" stroke="#F58733" stroke-width="1.2"/>
  <text x="548.0" y="208" class="r08-message-queue-note" text-anchor="middle">oldest message leaves first →</text>
  <line x1="394" y1="144" x2="446" y2="144" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r08-message-queue-arrow)"/>
  <circle cx="420" cy="124" r="12" fill="#61DBA8"/>
  <text x="420" y="128.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">2</text>
  <text x="420" y="164" class="r08-message-queue-note" text-anchor="middle">publish</text>
  <rect x="708" y="104" width="140" height="40" rx="10" fill="#111C27" stroke="#648BC4" stroke-width="1.5"/>
  <text x="724" y="129" class="r08-message-queue-lbl" fill="#A0A0B0">Worker 1</text>
  <rect x="708" y="156" width="140" height="40" rx="10" fill="#111C27" stroke="#648BC4" stroke-width="1.5"/>
  <text x="724" y="181" class="r08-message-queue-lbl" fill="#A0A0B0">Worker 2</text>
  <line x1="650" y1="172" x2="706" y2="176" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r08-message-queue-arrow)"/>
  <rect x="708" y="208" width="140" height="40" rx="10" fill="#300808" stroke="#E34545" stroke-width="1.5"/>
  <text x="724" y="233" class="r08-message-queue-lbl" fill="#E76060">Worker 3  ✗</text>
  <line x1="650" y1="172" x2="706" y2="228" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r08-message-queue-arrow)"/>
  <line x1="650" y1="140" x2="706" y2="136" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r08-message-queue-arrow)"/>
  <line x1="706" y1="114" x2="652" y2="114" stroke="#648BC4" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#r08-message-queue-arrow)"/>
  <text x="679" y="106" class="r08-message-queue-note" text-anchor="middle">ack</text>
  <line x1="706" y1="236" x2="652" y2="204" stroke="#648BC4" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#r08-message-queue-arrow)"/>
  <text x="708" y="266" class="r08-message-queue-note" fill="#E76060">crashed before ack:</text>
  <text x="708" y="282" class="r08-message-queue-note">message goes back</text>
  <text x="708" y="298" class="r08-message-queue-note">into the queue</text>
  <line x1="548" y1="226" x2="548" y2="286" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r08-message-queue-arrow)"/>
  <text x="540" y="252" class="r08-message-queue-note" text-anchor="end">after max</text>
  <text x="540" y="268" class="r08-message-queue-note" text-anchor="end">retries</text>
  <rect x="448" y="288" width="200" height="64" rx="10" fill="#300808" stroke="#E34545" stroke-width="1.5"/>
  <text x="464" y="313" class="r08-message-queue-lbl" fill="#E76060">Dead-letter queue</text>
  <text x="464" y="333" class="r08-message-queue-note">parked for a human to inspect</text>
  <rect x="32" y="262" width="360" height="106" rx="10" fill="#0B0B0F" stroke="#C4D4E8" stroke-width="1.5"/>
  <circle cx="54" cy="288" r="12" fill="#61DBA8"/>
  <text x="54" y="292.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">4</text>
  <text x="74" y="293" class="r08-message-queue-lbl" fill="#FFFFFF">Workers pull messages, do the slow work</text>
  <circle cx="54" cy="318" r="12" fill="#61DBA8"/>
  <text x="54" y="322.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">5</text>
  <text x="74" y="323" class="r08-message-queue-lbl" fill="#FFFFFF">Ack only after the work succeeded</text>
  <text x="74" y="341" class="r08-message-queue-note">no ack (crash, timeout) → retried later, so</text>
  <text x="74" y="356" class="r08-message-queue-note">a message may arrive twice: be idempotent</text>
  <g transform="translate(32,384)">
    <rect width="816" height="104" rx="10" fill="#111C27" stroke="#2A2A2A"/>
    <text x="16" y="28" class="r08-message-queue-h">What the queue buys you</text>
    <text x="16" y="56" class="r08-message-queue-lbl" fill="#69DDAD">Decoupling</text>
    <text x="16" y="74" class="r08-message-queue-note">API and workers deploy,</text>
    <text x="16" y="90" class="r08-message-queue-note">scale and restart separately</text>
    <text x="290" y="56" class="r08-message-queue-lbl" fill="#F69850">Durability</text>
    <text x="290" y="74" class="r08-message-queue-note">jobs wait safely even if every</text>
    <text x="290" y="90" class="r08-message-queue-note">worker is down for a while</text>
    <text x="560" y="56" class="r08-message-queue-lbl" fill="#5787F0">Load leveling</text>
    <text x="560" y="74" class="r08-message-queue-note">a traffic spike just grows the queue;</text>
    <text x="560" y="90" class="r08-message-queue-note">workers drain it at a steady pace</text>
  </g>
</svg>
