<svg fill="#FFFFFF" xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="r07-cache-aside-t r07-cache-aside-d">
  <title id="r07-cache-aside-t">Cache-aside read and write paths</title>
  <desc id="r07-cache-aside-d">Read path: a request checks the cache; on a hit the cached value is returned in about 1 ms. On a miss the app reads the database, stores the result in the cache with a TTL, then returns it. Write path: the app updates the database and deletes the cached key so the next read loads fresh data.</desc>
  <defs>
    <marker id="r07-cache-aside-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8199BB"/>
    </marker>
    <style>
      .r07-cache-aside-title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r07-cache-aside-sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r07-cache-aside-h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .r07-cache-aside-lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .r07-cache-aside-note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #A0A0B0; }
      .r07-cache-aside-code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- canvas -->
  <text x="32" y="44" class="r07-cache-aside-title">Cache-aside: your app manages the cache</text>
  <text x="32" y="66" class="r07-cache-aside-sub">Reads check the cache first and only touch the database on a miss. Writes delete the cached copy.</text>
  <text x="32" y="100" class="r07-cache-aside-h">Read path</text>
  <rect x="32" y="112" width="180" height="64" rx="10" fill="#081A30" stroke="#3B73ED" stroke-width="1.5"/>
  <circle cx="54" cy="144" r="12" fill="#61DBA8"/>
  <text x="54" y="148.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">1</text>
  <text x="74" y="140" class="r07-cache-aside-lbl" fill="#5787F0">Request arrives</text>
  <text x="74" y="161" class="r07-cache-aside-code">GET /products/42</text>
  <line x1="214" y1="144" x2="242" y2="144" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <rect x="244" y="112" width="200" height="64" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <circle cx="266" cy="144" r="12" fill="#61DBA8"/>
  <text x="266" y="148.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">2</text>
  <text x="286" y="140" class="r07-cache-aside-lbl" fill="#F69850">Check the cache</text>
  <text x="286" y="161" class="r07-cache-aside-code">GET product:42</text>
  <line x1="446" y1="144" x2="458" y2="144" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <polygon points="520,112 580,144 520,176 460,144" fill="#111C27" stroke="#648BC4" stroke-width="1.5"/>
  <text x="520" y="149" class="r07-cache-aside-lbl" fill="#FFFFFF" text-anchor="middle">In cache?</text>
  <line x1="582" y1="144" x2="618" y2="144" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <text x="600" y="134" class="r07-cache-aside-note" text-anchor="middle">yes</text>
  <rect x="620" y="112" width="228" height="64" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="1.5"/>
  <text x="640" y="140" class="r07-cache-aside-lbl" fill="#69DDAD">HIT: return it right away</text>
  <text x="640" y="161" class="r07-cache-aside-note">X-Cache: HIT · about 1 ms</text>
  <line x1="520" y1="178" x2="520" y2="226" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <text x="530" y="206" class="r07-cache-aside-note">no (miss)</text>
  <rect x="380" y="228" width="210" height="76" rx="10" fill="#111C27" stroke="#648BC4" stroke-width="1.5"/>
  <circle cx="402" cy="266" r="12" fill="#61DBA8"/>
  <text x="402" y="270.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">3</text>
  <text x="422" y="258" class="r07-cache-aside-lbl" fill="#A0A0B0">Read the database</text>
  <text x="422" y="280" class="r07-cache-aside-code">SELECT … id = 42</text>
  <line x1="592" y1="266" x2="618" y2="266" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <rect x="620" y="228" width="228" height="76" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <circle cx="642" cy="266" r="12" fill="#61DBA8"/>
  <text x="642" y="270.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">4</text>
  <text x="662" y="252" class="r07-cache-aside-lbl" fill="#F69850">Save in cache + TTL</text>
  <text x="662" y="273" class="r07-cache-aside-code">SET product:42 EX 300</text>
  <text x="662" y="293" class="r07-cache-aside-note">then return · about 50 ms</text>
  <rect x="32" y="228" width="316" height="76" rx="10" fill="#111C27" stroke="#C4D4E8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="48" y="256" class="r07-cache-aside-lbl" fill="#FFFFFF">Next request for product:42</text>
  <text x="48" y="278" class="r07-cache-aside-note">is a HIT until the 300 s TTL runs out, so the</text>
  <text x="48" y="294" class="r07-cache-aside-note">database sees about one query per TTL window.</text>
  <rect x="32" y="332" width="816" height="120" rx="10" fill="#111C27" stroke="#2A2A2A"/>
  <text x="48" y="358" class="r07-cache-aside-h">Write path</text>
  <text x="140" y="358" class="r07-cache-aside-note">keep writes simple: update the source of truth, then throw the old copy away</text>
  <rect x="48" y="372" width="186" height="64" rx="10" fill="#081A30" stroke="#3B73ED" stroke-width="1.5"/>
  <circle cx="70" cy="404" r="12" fill="#61DBA8"/>
  <text x="70" y="408.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">1</text>
  <text x="90" y="400" class="r07-cache-aside-lbl" fill="#5787F0">Client updates</text>
  <text x="90" y="421" class="r07-cache-aside-code">PUT /products/42</text>
  <rect x="252" y="372" width="186" height="64" rx="10" fill="#111C27" stroke="#648BC4" stroke-width="1.5"/>
  <circle cx="274" cy="404" r="12" fill="#61DBA8"/>
  <text x="274" y="408.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">2</text>
  <text x="294" y="400" class="r07-cache-aside-lbl" fill="#A0A0B0">Write the database</text>
  <text x="294" y="421" class="r07-cache-aside-code">UPDATE products…</text>
  <rect x="456" y="372" width="186" height="64" rx="10" fill="#302808" stroke="#F58733" stroke-width="1.5"/>
  <circle cx="478" cy="404" r="12" fill="#61DBA8"/>
  <text x="478" y="408.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0E0622;">3</text>
  <text x="498" y="400" class="r07-cache-aside-lbl" fill="#F69850">Delete cached copy</text>
  <text x="498" y="421" class="r07-cache-aside-code">DEL product:42</text>
  <rect x="660" y="372" width="172" height="64" rx="10" fill="#11271B" stroke="#50D89F" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="676" y="400" class="r07-cache-aside-lbl" fill="#69DDAD">Next read = MISS</text>
  <text x="676" y="421" class="r07-cache-aside-note">reloads the fresh price</text>
  <line x1="236" y1="404" x2="250" y2="404" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <line x1="440" y1="404" x2="454" y2="404" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <line x1="644" y1="404" x2="658" y2="404" stroke="#648BC4" stroke-width="1.75" marker-end="url(#r07-cache-aside-arrow)"/>
  <text x="32" y="480" class="r07-cache-aside-note">Rule of thumb: always set a TTL, even when you also delete on write. It is the safety net for any write path you forget.</text>
</svg>
