<svg xmlns="http://www.w3.org/2000/svg" width="880" height="536" viewBox="0 0 880 536" role="img" aria-labelledby="t d">
  <title id="t">Saga pattern: forward steps and compensating actions</title>
  <desc id="d">An order saga runs three local transactions in order: create order, reserve inventory, charge payment. The payment step fails with card declined, so the saga undoes the completed steps in reverse order: there is no charge to refund, inventory is released, then the order is cancelled, and the client is told no charge was made. Every step and undo must be idempotent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="535" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Saga: undo the finished steps, in reverse</text>
  <text x="32" y="66" class="sub">No single transaction spans three services, so each step needs its own explicit “undo”.</text>
  <text x="32" y="102" class="h">Forward steps — each is a local transaction in that service’s own database</text>
  <rect x="32" y="116" width="232" height="78" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="54" cy="140" r="12" fill="#1c7c54"/>
  <text x="54" y="144" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="76" y="145" class="lbl" fill="#1c7c54">Create order</text>
  <text x="76" y="166" class="note">Orders service</text>
  <line x1="266" y1="155" x2="320" y2="155" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="324" y="116" width="232" height="78" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="346" cy="140" r="12" fill="#1c7c54"/>
  <text x="346" y="144" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="368" y="145" class="lbl" fill="#1c7c54">Reserve inventory</text>
  <text x="368" y="166" class="note">Inventory service</text>
  <line x1="558" y1="155" x2="612" y2="155" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="616" y="116" width="232" height="78" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="638" cy="140" r="12" fill="#1c7c54"/>
  <text x="638" y="144" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="660" y="145" class="lbl" fill="#b91c1c">Charge payment</text>
  <text x="660" y="166" class="note">Payments service</text>
  <text x="660" y="186" class="lbl" fill="#b91c1c">✗ fails: card_declined</text>
  <text x="76" y="186" class="note" fill="#1c7c54">✓ committed</text>
  <text x="368" y="186" class="note" fill="#1c7c54">✓ committed</text>
  <text x="32" y="236" class="h" fill="#b91c1c">Compensations — run backwards, newest first</text>
  <line x1="732" y1="194" x2="732" y2="252" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="616" y="256" width="232" height="78" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="638" y="281" class="lbl" fill="#475569">Refund payment: skipped</text>
  <text x="638" y="302" class="note">no charge_id — nothing was</text>
  <text x="638" y="320" class="note">charged, so nothing to undo</text>
  <line x1="614" y1="295" x2="560" y2="295" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="324" y="256" width="232" height="78" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="346" cy="280" r="12" fill="#1c7c54"/>
  <text x="346" y="284" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="368" y="285" class="lbl" fill="#b45309">Release inventory</text>
  <text x="368" y="306" class="note">undoes step 2</text>
  <line x1="322" y1="295" x2="268" y2="295" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="256" width="232" height="78" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="54" cy="280" r="12" fill="#1c7c54"/>
  <text x="54" y="284" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="76" y="285" class="lbl" fill="#b45309">Cancel order</text>
  <text x="76" y="306" class="note">undoes step 1</text>
  <line x1="148" y1="334" x2="148" y2="370" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="372" width="816" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="399" class="lbl" fill="#2563eb">Client gets 402 Payment Required — “No charge was made and inventory has been released.”</text>
  <rect x="32" y="436" width="396" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="460" class="lbl" fill="#475569">Every step and undo is idempotent</text>
  <text x="48" y="480" class="note">Key = saga_id:step_name, so a retried “release”</text>
  <text x="48" y="498" class="note">never releases twice or refunds twice.</text>
  <rect x="452" y="436" width="396" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="468" y="460" class="lbl" fill="#b91c1c">An undo is new work, not a free rollback</text>
  <text x="468" y="480" class="note">It can fail too (and an email can’t be un-sent):</text>
  <text x="468" y="498" class="note">persist saga state and alert a human on failure.</text>
</svg>
