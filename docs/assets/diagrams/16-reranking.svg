  <text x="468" y="462" class="lbl" style="fill: #6d28d9;">Stage 2 · cross-encoder (reranker)</text>
  <text x="468" y="482" class="note">one model pass per query + chunk pair</text>
  <text x="468" y="498" class="note">→ much more accurate, too slow for the whole corpus</text>
