<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
  <title id="t">CDN edge caching of an API response</title>
  <desc id="d">A client sends GET /products/42 to a CDN edge node. The edge looks up a cache key built from the URL plus any Vary headers. On a hit it replies directly with an Age header and the origin is never contacted. On a miss it forwards the request to the origin API, which returns 200 with Cache-Control public, s-maxage 300 and Vary Accept-Encoding; the edge stores the response and replies. Responses to authenticated requests must be marked private or no-store so shared caches never store them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="469" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">The edge answers if it can; the origin only sees misses</text>
  <text x="32" y="66" class="sub">The cache key is the URL plus the headers named in Vary. Cache-Control on the response decides who may store it.</text>

  <rect x="32" y="92" width="170" height="96" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="118" class="lbl" fill="#2563eb">Client</text>
  <text x="48" y="140" class="code">GET /products/42</text>
  <text x="48" y="162" class="note">Accept-Encoding: gzip</text>

  <rect x="330" y="92" width="220" height="96" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="346" y="118" class="lbl" fill="#475569">CDN edge (nearest PoP)</text>
  <text x="346" y="140" class="note">cache key = URL + Vary headers</text>
  <text x="346" y="162" class="note">fresh while age &lt; s-maxage</text>

  <rect x="678" y="92" width="170" height="96" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="694" y="118" class="lbl" fill="#1c7c54">Origin API</text>
  <text x="694" y="140" class="note">FastAPI + database</text>
  <text x="694" y="162" class="note">sees misses only</text>

  <line x1="202" y1="116" x2="326" y2="116" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="264" cy="102" r="10" fill="#1c7c54"/>
  <text x="264" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <line x1="326" y1="164" x2="206" y2="164" stroke="#1c7c54" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="264" y="182" text-anchor="middle" class="lbl" fill="#1c7c54">HIT: Age 74</text>

  <line x1="550" y1="116" x2="674" y2="116" stroke="#b45309" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="612" cy="102" r="10" fill="#1c7c54"/>
  <text x="612" y="106" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <line x1="674" y1="164" x2="554" y2="164" stroke="#b45309" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="612" y="182" text-anchor="middle" class="lbl" fill="#b45309">MISS: forward</text>

  <text x="32" y="222" class="h">Three outcomes, set by the response headers</text>

  <rect x="32" y="236" width="264" height="150" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="48" y="260" class="lbl" fill="#1c7c54">Edge HIT</text>
  <text x="48" y="284" class="note">Key matches and entry is fresh.</text>
  <text x="48" y="304" class="note">Edge replies in a few ms, close to</text>
  <text x="48" y="322" class="note">the user. Origin never sees it.</text>
  <text x="48" y="350" class="code">Age: 74</text>
  <text x="48" y="370" class="code">X-Cache: HIT</text>

  <rect x="308" y="236" width="264" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="324" y="260" class="lbl" fill="#b45309">Edge MISS or stale</text>
  <text x="324" y="284" class="note">Edge asks origin (often with</text>
  <text x="324" y="304" class="note">If-None-Match), stores the reply,</text>
  <text x="324" y="322" class="note">then answers the client.</text>
  <text x="324" y="350" class="code">Cache-Control: public,</text>
  <text x="324" y="370" class="code"> s-maxage=300</text>

  <rect x="584" y="236" width="264" height="150" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="600" y="260" class="lbl" fill="#b91c1c">Never in a shared cache</text>
  <text x="600" y="284" class="note">Per-user or authenticated data.</text>
  <text x="600" y="304" class="note">Mark it so the edge refuses to</text>
  <text x="600" y="322" class="note">store it, or it leaks to others.</text>
  <text x="600" y="350" class="code">Cache-Control: private</text>
  <text x="600" y="370" class="code">Cache-Control: no-store</text>

  <rect x="32" y="406" width="816" height="44" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="48" y="425" class="lbl" fill="#7c3aed">Vary splits the cache key</text>
  <text x="48" y="442" class="note">Vary: Accept-Encoding stores one copy per encoding. Vary: Cookie would give each user a copy, so it defeats the cache.</text>
</svg>
