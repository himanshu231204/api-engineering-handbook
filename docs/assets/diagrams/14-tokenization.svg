<svg xmlns="http://www.w3.org/2000/svg" width="880" height="476" viewBox="0 0 880 476" role="img" aria-labelledby="t d">
  <title id="t">How text becomes tokens</title>
  <desc id="d">The sentence "Unbelievably, tokenization isn't magic." has 4 words but a tokenizer splits it into 10 tokens, each with a numeric ID. The model only sees the IDs. Rare words split into several tokens, and cost equals input tokens times the input price plus output tokens times the output price.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="475" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Text becomes tokens, not words</text>
  <text x="32" y="66" class="sub">A tokenizer cuts text into pieces from a fixed vocabulary. Each piece has a number (IDs here are illustrative).</text>

  <!-- input text -->
  <rect x="32" y="88" width="816" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="115" class="lbl" fill="#2563eb">Your text</text>
  <text x="136" y="115" class="code">"Unbelievably, tokenization isn't magic."</text>
  <text x="832" y="115" class="lbl" fill="#2563eb" text-anchor="end">4 words</text>

  <!-- tokenizer arrow -->
  <line x1="440" y1="134" x2="440" y2="170" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="452" y="155" class="note">tokenizer (BPE)</text>

  <!-- word labels over groups -->
  <text x="124" y="186" class="note" text-anchor="middle">Unbelievably</text>
  <line x1="32" y1="191" x2="216" y2="191" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="340" y="186" class="note" text-anchor="middle">tokenization</text>
  <line x1="264" y1="191" x2="416" y2="191" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="472" y="186" class="note" text-anchor="middle">isn't</text>
  <line x1="424" y1="191" x2="520" y2="191" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="560" y="186" class="note" text-anchor="middle">magic</text>
  <line x1="528" y1="191" x2="592" y2="191" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- token chips: y 198..234 -->
  <g>
    <rect x="32"  y="198" width="40" height="36" rx="8" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
    <text x="52"  y="221" class="code" text-anchor="middle">Un</text>
    <rect x="80"  y="198" width="72" height="36" rx="8" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
    <text x="116" y="221" class="code" text-anchor="middle">believ</text>
    <rect x="160" y="198" width="56" height="36" rx="8" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
    <text x="188" y="221" class="code" text-anchor="middle">ably</text>
    <rect x="224" y="198" width="32" height="36" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="240" y="221" class="code" text-anchor="middle">,</text>
    <rect x="264" y="198" width="64" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="296" y="221" class="code" text-anchor="middle">token</text>
    <rect x="336" y="198" width="80" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="376" y="221" class="code" text-anchor="middle">ization</text>
    <rect x="424" y="198" width="48" height="36" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="448" y="221" class="code" text-anchor="middle">isn</text>
    <rect x="480" y="198" width="40" height="36" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="500" y="221" class="code" text-anchor="middle">'t</text>
    <rect x="528" y="198" width="64" height="36" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="560" y="221" class="code" text-anchor="middle">magic</text>
    <rect x="600" y="198" width="32" height="36" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="616" y="221" class="code" text-anchor="middle">.</text>
  </g>
  <text x="656" y="221" class="lbl" fill="#1c7c54">= 10 tokens</text>

  <!-- token ids -->
  <text x="52"  y="254" class="note" text-anchor="middle">1844</text>
  <text x="116" y="254" class="note" text-anchor="middle">31141</text>
  <text x="188" y="254" class="note" text-anchor="middle">2915</text>
  <text x="240" y="254" class="note" text-anchor="middle">11</text>
  <text x="296" y="254" class="note" text-anchor="middle">4037</text>
  <text x="376" y="254" class="note" text-anchor="middle">2065</text>
  <text x="448" y="254" class="note" text-anchor="middle">4536</text>
  <text x="500" y="254" class="note" text-anchor="middle">956</text>
  <text x="560" y="254" class="note" text-anchor="middle">11204</text>
  <text x="616" y="254" class="note" text-anchor="middle">13</text>
  <text x="656" y="254" class="note">← token IDs</text>

  <!-- what the model sees -->
  <rect x="32" y="270" width="816" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="295" class="lbl" fill="#475569">Model sees</text>
  <text x="144" y="295" class="code">[1844, 31141, 2915, 11, 4037, 2065, 4536, 956, 11204, 13]</text>

  <!-- bottom: tokens != words -->
  <rect x="32" y="330" width="396" height="122" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="356" class="h">Tokens ≠ words</text>
  <text x="48" y="382" class="note">• Common words are often 1 token ("the", "cat")</text>
  <text x="48" y="404" class="note">• Rare words, code, numbers, other languages → several</text>
  <text x="48" y="426" class="note">• English rule of thumb: about 4 characters ≈ 1 token</text>

  <!-- bottom: cost -->
  <rect x="452" y="330" width="396" height="122" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="468" y="356" class="h">You pay per token, both ways</text>
  <text x="468" y="384" class="code">cost = input tokens × in price</text>
  <text x="523" y="406" class="code">+ output tokens × out price</text>
  <text x="468" y="432" class="note">Output tokens usually cost more per token than input.</text>
</svg>
