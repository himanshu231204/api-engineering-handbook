<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="t d">
  <title id="t">RabbitMQ: producer, exchange, bound queues, consumers</title>
  <desc id="d">A producer publishes messages with a routing key to an exchange, never directly to a queue. The exchange type decides routing. A direct exchange delivers to queues whose binding key equals the routing key exactly, so key invoice reaches pdf_queue but not email_queue. A topic exchange matches wildcard patterns, so key order.eu.created reaches both a queue bound with order.eu.* and one bound with order.#. A fanout exchange ignores the key and copies the message to every bound queue. Each queue holds messages durably until a consumer acknowledges them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c7c54"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="539" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">RabbitMQ: producers publish to exchanges, not queues</text>
  <text x="32" y="66" class="sub">The exchange type decides which bound queues get a copy. Each queue is consumed independently.</text>
  <rect x="32" y="110" width="100" height="340" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="82" y="270" text-anchor="middle" class="lbl" fill="#2563eb">Producer</text>
  <text x="82" y="290" text-anchor="middle" class="note">publish with</text>
  <text x="82" y="306" text-anchor="middle" class="note">a routing key</text>

  <rect x="182" y="118" width="214" height="68" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="198" y="140" class="lbl" fill="#1c7c54">direct exchange</text>
  <text x="198" y="158" class="note">exact key match</text>
  <text x="198" y="176" class="code">key = invoice</text>
  <line x1="132" y1="152" x2="180" y2="152" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="470" y="100" width="200" height="46" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="484" y="120" class="lbl" fill="#475569">pdf_queue</text>
  <text x="484" y="137" class="note">binding: invoice</text>
  <path d="M396 152 C430 152 436 123 468 123" fill="none" stroke="#1c7c54" stroke-width="1.75" marker-end="url(#arrowg)"/>
  <line x1="670" y1="123" x2="728" y2="123" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="730" y="100" width="118" height="46" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="789" y="120" text-anchor="middle" class="lbl" fill="#1c7c54">Consumer</text>
  <text x="789" y="137" text-anchor="middle" class="note">ack when done</text>
  <rect x="470" y="156" width="200" height="46" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="484" y="176" class="lbl" fill="#475569">email_queue</text>
  <text x="484" y="193" class="note">binding: receipt</text>
  <path d="M396 152 C430 152 436 179 468 179" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="689" y="184" class="note" fill="#b91c1c">no match: not delivered</text>
  <rect x="182" y="246" width="214" height="68" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="198" y="268" class="lbl" fill="#b45309">topic exchange</text>
  <text x="198" y="286" class="note">wildcards: * one word, # many</text>
  <text x="198" y="304" class="code">key = order.eu.created</text>
  <line x1="132" y1="280" x2="180" y2="280" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="470" y="228" width="200" height="46" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="484" y="248" class="lbl" fill="#475569">eu_orders</text>
  <text x="484" y="265" class="note">binding: order.eu.*</text>
  <path d="M396 280 C430 280 436 251 468 251" fill="none" stroke="#1c7c54" stroke-width="1.75" marker-end="url(#arrowg)"/>
  <line x1="670" y1="251" x2="728" y2="251" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="730" y="228" width="118" height="46" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="789" y="248" text-anchor="middle" class="lbl" fill="#1c7c54">Consumer</text>
  <text x="789" y="265" text-anchor="middle" class="note">ack when done</text>
  <rect x="470" y="284" width="200" height="46" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="484" y="304" class="lbl" fill="#475569">audit_log</text>
  <text x="484" y="321" class="note">binding: order.#</text>
  <path d="M396 280 C430 280 436 307 468 307" fill="none" stroke="#1c7c54" stroke-width="1.75" marker-end="url(#arrowg)"/>
  <line x1="670" y1="307" x2="728" y2="307" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="730" y="284" width="118" height="46" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="789" y="304" text-anchor="middle" class="lbl" fill="#1c7c54">Consumer</text>
  <text x="789" y="321" text-anchor="middle" class="note">ack when done</text>
  <rect x="182" y="374" width="214" height="68" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="198" y="396" class="lbl" fill="#7c3aed">fanout exchange</text>
  <text x="198" y="414" class="note">ignores the key, copies to all</text>
  <text x="198" y="432" class="code">key = (ignored)</text>
  <line x1="132" y1="408" x2="180" y2="408" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="470" y="356" width="200" height="46" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="484" y="376" class="lbl" fill="#475569">cache_inval</text>
  <text x="484" y="393" class="note">binding: (none)</text>
  <path d="M396 408 C430 408 436 379 468 379" fill="none" stroke="#1c7c54" stroke-width="1.75" marker-end="url(#arrowg)"/>
  <line x1="670" y1="379" x2="728" y2="379" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="730" y="356" width="118" height="46" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="789" y="376" text-anchor="middle" class="lbl" fill="#1c7c54">Consumer</text>
  <text x="789" y="393" text-anchor="middle" class="note">ack when done</text>
  <rect x="470" y="412" width="200" height="46" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="484" y="432" class="lbl" fill="#475569">search_index</text>
  <text x="484" y="449" class="note">binding: (none)</text>
  <path d="M396 408 C430 408 436 435 468 435" fill="none" stroke="#1c7c54" stroke-width="1.75" marker-end="url(#arrowg)"/>
  <line x1="670" y1="435" x2="728" y2="435" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="730" y="412" width="118" height="46" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="789" y="432" text-anchor="middle" class="lbl" fill="#1c7c54">Consumer</text>
  <text x="789" y="449" text-anchor="middle" class="note">ack when done</text>
  <text x="32" y="486" class="h">How a message travels</text>
  <circle cx="44" cy="512" r="12" fill="#1c7c54"/>
  <text x="44" y="516" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="64" y="516" class="note">Producer publishes</text>
  <circle cx="256" cy="512" r="12" fill="#1c7c54"/>
  <text x="256" y="516" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="276" y="516" class="note">Exchange applies bindings</text>
  <circle cx="468" cy="512" r="12" fill="#1c7c54"/>
  <text x="468" y="516" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="488" y="516" class="note">Queue stores it</text>
  <circle cx="680" cy="512" r="12" fill="#1c7c54"/>
  <text x="680" y="516" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="700" y="516" class="note">Consumer acks it</text>
</svg>
