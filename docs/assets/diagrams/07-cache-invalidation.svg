<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">Cache invalidation strategies compared</title>
  <desc id="d">Three columns follow the same price change from 89.99 to 79.99. TTL only: reads stay stale until the TTL expires. Delete on write: usually fresh at once, but a slow reader that loaded the old row can write it back after the delete. Versioned keys: the write bumps a version number, readers switch to the new key, and late writes to the old key are never read.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="519" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Three ways to keep a cache honest</text>
  <text x="32" y="66" class="sub">Same story in every column: the price changes from 89.99 to 79.99. Who still sees the old price?</text>
  <rect x="32" y="88" width="256" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="160.0" y="113" class="h" fill="#475569" text-anchor="middle">TTL only</text>
  <rect x="32" y="146" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="173" r="12" fill="#1c7c54"/>
  <text x="56" y="177.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">1</text>
  <text x="78" y="169" class="lbl" fill="#1f2937">Cache: price 89.99</text>
  <text x="78" y="187" class="note">stored with a 300 s TTL</text>
  <line x1="160.0" y1="201" x2="160.0" y2="212" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="214" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="56" cy="241" r="12" fill="#1c7c54"/>
  <text x="56" y="245.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">2</text>
  <text x="78" y="237" class="lbl" fill="#1f2937">DB updated to 79.99</text>
  <text x="78" y="255" class="note">nobody touches the cache</text>
  <line x1="160.0" y1="269" x2="160.0" y2="280" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="282" width="256" height="54" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="56" cy="309" r="12" fill="#1c7c54"/>
  <text x="56" y="313.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">3</text>
  <text x="78" y="305" class="lbl" fill="#1f2937">Reads return 89.99</text>
  <text x="78" y="323" class="note">stale until the TTL runs out</text>
  <line x1="160.0" y1="337" x2="160.0" y2="348" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="350" width="256" height="54" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="56" cy="377" r="12" fill="#1c7c54"/>
  <text x="56" y="381.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">4</text>
  <text x="78" y="373" class="lbl" fill="#1f2937">TTL expires</text>
  <text x="78" y="391" class="note">next read loads 79.99</text>
  <line x1="160.0" y1="405" x2="160.0" y2="422" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="424" width="256" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="449" class="lbl" fill="#b45309">Stale for up to one TTL</text>
  <text x="48" y="469" class="note">simple: no write-path code</text>
  <rect x="312" y="88" width="256" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440.0" y="113" class="h" fill="#2563eb" text-anchor="middle">Delete on write</text>
  <rect x="312" y="146" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="336" cy="173" r="12" fill="#1c7c54"/>
  <text x="336" y="177.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">1</text>
  <text x="358" y="169" class="lbl" fill="#1f2937">Reader A: cache miss</text>
  <text x="358" y="187" class="note">reads 89.99 from the DB …</text>
  <line x1="440.0" y1="201" x2="440.0" y2="212" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="312" y="214" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="336" cy="241" r="12" fill="#1c7c54"/>
  <text x="336" y="245.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">2</text>
  <text x="358" y="237" class="lbl" fill="#1f2937">Writer: DB → 79.99</text>
  <text x="358" y="255" class="note">UPDATE products …</text>
  <line x1="440.0" y1="269" x2="440.0" y2="280" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="312" y="282" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="336" cy="309" r="12" fill="#1c7c54"/>
  <text x="336" y="313.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">3</text>
  <text x="358" y="305" class="lbl" fill="#1f2937">Writer: DEL product:42</text>
  <text x="358" y="323" class="note">the cache is now empty</text>
  <line x1="440.0" y1="337" x2="440.0" y2="348" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="312" y="350" width="256" height="54" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="336" cy="377" r="12" fill="#1c7c54"/>
  <text x="336" y="381.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">4</text>
  <text x="358" y="373" class="lbl" fill="#1f2937">Reader A: SET 89.99</text>
  <text x="358" y="391" class="note">old value is back: stale!</text>
  <line x1="440.0" y1="405" x2="440.0" y2="422" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="312" y="424" width="256" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="328" y="449" class="lbl" fill="#b45309">Fresh right after writes</text>
  <text x="328" y="469" class="note">rare race: keep a TTL too</text>
  <rect x="592" y="88" width="256" height="40" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="720.0" y="113" class="h" fill="#1c7c54" text-anchor="middle">Versioned keys</text>
  <rect x="592" y="146" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="616" cy="173" r="12" fill="#1c7c54"/>
  <text x="616" y="177.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">1</text>
  <text x="638" y="169" class="lbl" fill="#1f2937">Read product:42:v7</text>
  <text x="638" y="187" class="note">version kept in a small key</text>
  <line x1="720.0" y1="201" x2="720.0" y2="212" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="592" y="214" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="616" cy="241" r="12" fill="#1c7c54"/>
  <text x="616" y="245.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">2</text>
  <text x="638" y="237" class="lbl" fill="#1f2937">Writer: DB → 79.99</text>
  <text x="638" y="255" class="note">and sets the version to v8</text>
  <line x1="720.0" y1="269" x2="720.0" y2="280" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="592" y="282" width="256" height="54" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="616" cy="309" r="12" fill="#1c7c54"/>
  <text x="616" y="313.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">3</text>
  <text x="638" y="305" class="lbl" fill="#1f2937">Read product:42:v8</text>
  <text x="638" y="323" class="note">miss → loads 79.99, fresh</text>
  <line x1="720.0" y1="337" x2="720.0" y2="348" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="592" y="350" width="256" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="616" cy="377" r="12" fill="#1c7c54"/>
  <text x="616" y="381.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">4</text>
  <text x="638" y="373" class="lbl" fill="#1f2937">Late SET to v7?</text>
  <text x="638" y="391" class="note">harmless: nobody reads v7</text>
  <line x1="720.0" y1="405" x2="720.0" y2="422" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="592" y="424" width="256" height="60" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="608" y="449" class="lbl" fill="#1c7c54">No stale reads after a write</text>
  <text x="608" y="469" class="note">costs one extra tiny lookup</text>
  <text x="32" y="506" class="note">In practice: combine delete-on-write (or versioned keys) with a TTL, so any missed path still corrects itself.</text>
</svg>
