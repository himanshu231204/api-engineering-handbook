<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">How a webhook HMAC signature is created and verified</title>
  <desc id="d">The sender joins the timestamp and the raw body, computes HMAC-SHA256 with the shared secret and puts the timestamp and the result in a signature header. The receiver checks the timestamp is recent, recomputes the HMAC over the raw bytes with its own copy of the secret and compares the two values in constant time. A match is accepted; a stale timestamp or a mismatch is rejected with 400.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">HMAC webhook signatures, step by step</text>
  <text x="32" y="66" class="sub">Both sides hold the same secret; it is never sent. The receiver redoes the math and compares the result.</text>
  <rect x="32" y="88" width="372" height="300" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="48" y="114" class="h">Sender (provider)</text>
  <rect x="48" y="128" width="160" height="52" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="62" y="150" class="lbl" fill="#475569">timestamp</text>
  <text x="62" y="170" class="code">1755511200</text>
  <rect x="228" y="128" width="160" height="52" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="242" y="150" class="lbl" fill="#b45309">raw body</text>
  <text x="242" y="170" class="code">{"type":…}</text>
  <line x1="128" y1="182" x2="196" y2="210" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="308" y1="182" x2="240" y2="210" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="48" y="212" width="340" height="82" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="70" cy="253" r="12" fill="#1c7c54"/>
  <text x="70" y="257.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">1</text>
  <text x="92" y="238" class="lbl" fill="#1c7c54">sig = HMAC-SHA256(</text>
  <text x="92" y="261" class="code">secret, t + "." + body)</text>
  <text x="92" y="282" class="note">secret: shared once at setup, never sent</text>
  <line x1="218" y1="296" x2="218" y2="310" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="48" y="312" width="340" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="70" cy="343" r="12" fill="#1c7c54"/>
  <text x="70" y="347.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">2</text>
  <text x="92" y="338" class="lbl" fill="#2563eb">Send body + header</text>
  <text x="92" y="360" class="code">X-Signature: t=…,v1=sig</text>
  <line x1="406" y1="343" x2="474" y2="343" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="440" y="333" class="note" text-anchor="middle">POST</text>
  <rect x="476" y="88" width="372" height="300" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="492" y="114" class="h">Receiver (your API)</text>
  <rect x="492" y="128" width="340" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="514" cy="160" r="12" fill="#1c7c54"/>
  <text x="514" y="164.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">3</text>
  <text x="536" y="155" class="lbl" fill="#475569">Timestamp recent?</text>
  <text x="536" y="175" class="note">within 5 min, else reject (replay)</text>
  <line x1="662" y1="194" x2="662" y2="208" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="492" y="210" width="340" height="64" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="514" cy="242" r="12" fill="#1c7c54"/>
  <text x="514" y="246.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">4</text>
  <text x="536" y="237" class="lbl" fill="#1c7c54">Recompute HMAC</text>
  <text x="536" y="257" class="note">own secret + the RAW body bytes</text>
  <line x1="662" y1="276" x2="662" y2="290" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="492" y="292" width="340" height="64" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="514" cy="324" r="12" fill="#1c7c54"/>
  <text x="514" y="328.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">5</text>
  <text x="536" y="319" class="lbl" fill="#1c7c54">Constant-time compare</text>
  <text x="536" y="339" class="note">hmac.compare_digest(mine, theirs)</text>
  <line x1="600" y1="358" x2="560" y2="410" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="724" y1="358" x2="764" y2="410" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="476" y="412" width="180" height="60" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="492" y="437" class="lbl" fill="#1c7c54">Match → accept</text>
  <text x="492" y="457" class="note">return 200, then process</text>
  <rect x="668" y="412" width="180" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="684" y="437" class="lbl" fill="#b91c1c">Stale or mismatch</text>
  <text x="684" y="457" class="note">return 400, do nothing</text>
  <rect x="32" y="412" width="420" height="116" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="436" class="lbl" fill="#1f2937">What each check stops</text>
  <text x="48" y="458" class="note">Forged request: attacker lacks the secret → mismatch</text>
  <text x="48" y="476" class="note">Tampered body: one changed byte → different HMAC</text>
  <text x="48" y="494" class="note">Replayed request: valid sig, but timestamp too old</text>
  <text x="48" y="512" class="note">Timing attack: == leaks how many chars matched</text>
  <text x="476" y="500" class="note">Verify the raw bytes: re-serialized JSON can</text>
  <text x="476" y="516" class="note">change spacing or key order and break the match.</text>
</svg>
