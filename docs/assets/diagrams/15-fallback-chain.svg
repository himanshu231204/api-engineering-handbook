<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">A fallback chain for LLM calls</title>
  <desc id="d">A request goes first to the primary model. If it times out or fails after a bounded retry, the gateway tries a secondary provider, then a cheaper model, then a cached or graceful response. Each step down is logged, and a circuit breaker skips providers that are known to be failing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">When a provider fails, step down the chain</text>
  <text x="32" y="66" class="sub">Each step is a worse-but-working option. Every step down is logged, so nothing degrades silently.</text>

  <!-- boxes: y 110..190 -->
  <rect x="32" y="110" width="176" height="84" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="56" cy="134" r="12" fill="#1c7c54"/><text x="56" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="139" class="lbl" fill="#1c7c54">Primary model</text>
  <text x="48" y="162" class="note">best quality, normal path</text>
  <text x="48" y="180" class="note">1 quick retry on timeout</text>

  <rect x="248" y="110" width="176" height="84" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="272" cy="134" r="12" fill="#1c7c54"/><text x="272" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="292" y="139" class="lbl" fill="#6d28d9">Other provider</text>
  <text x="264" y="162" class="note">same tier, different vendor</text>
  <text x="264" y="180" class="note">quality barely changes</text>

  <rect x="464" y="110" width="176" height="84" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="488" cy="134" r="12" fill="#1c7c54"/><text x="488" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="508" y="139" class="lbl" fill="#b45309">Cheaper model</text>
  <text x="480" y="162" class="note">lower tier, faster</text>
  <text x="480" y="180" class="note">quality drop: flag it</text>

  <rect x="680" y="110" width="168" height="84" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="704" cy="134" r="12" fill="#1c7c54"/><text x="704" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="724" y="139" class="lbl" fill="#475569">Last resort</text>
  <text x="696" y="162" class="note">cached or stale answer,</text>
  <text x="696" y="180" class="note">or a clear "try again"</text>

  <!-- failure arrows -->
  <line x1="210" y1="152" x2="244" y2="152" stroke="#b91c1c" stroke-width="1.75" marker-end="url(#arrowred)"/>
  <line x1="426" y1="152" x2="460" y2="152" stroke="#b91c1c" stroke-width="1.75" marker-end="url(#arrowred)"/>
  <line x1="642" y1="152" x2="676" y2="152" stroke="#b91c1c" stroke-width="1.75" marker-end="url(#arrowred)"/>
  <text x="228" y="144" class="note" text-anchor="middle" fill="#b91c1c">fails</text>
  <text x="444" y="144" class="note" text-anchor="middle" fill="#b91c1c">fails</text>
  <text x="660" y="144" class="note" text-anchor="middle" fill="#b91c1c">fails</text>

  <!-- request in -->
  <text x="32" y="98" class="lbl" fill="#2563eb">Request in →</text>

  <!-- success -->
  <rect x="32" y="246" width="816" height="40" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="48" y="271" class="lbl" fill="#1c7c54">First step that succeeds answers the caller.</text>
  <text x="372" y="271" class="note">Response says which step served it (e.g. fallback: true, provider: B).</text>

  <!-- rules -->
  <rect x="32" y="302" width="396" height="76" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="48" y="326" class="h">Circuit breaker</text>
  <text x="48" y="347" class="note">After repeated failures a provider is skipped at once,</text>
  <text x="48" y="365" class="note">so users do not wait for its timeout on every request.</text>

  <rect x="452" y="302" width="396" height="76" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="468" y="326" class="h">Rules of the chain</text>
  <text x="468" y="347" class="note">Retry only transient errors; a 429 moves on immediately.</text>
  <text x="468" y="365" class="note">Cap total time across the whole chain, not just per step.</text>
</svg>
