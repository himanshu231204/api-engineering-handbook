<svg xmlns="http://www.w3.org/2000/svg" width="880" height="508" viewBox="0 0 880 508" role="img" aria-labelledby="t d">
  <title id="t">FastAPI dependency injection graph</title>
  <desc id="d">A route declares Depends(get_current_user). FastAPI builds get_settings, then get_db, then get_current_user, and passes the user to the route. In tests, app.dependency_overrides swaps get_db for an in-memory fake without changing the route.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="507" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Dependency injection: declare it, FastAPI builds it</text>
  <text x="32" y="66" class="sub">Each box is a function. Arrows show what feeds into what, in the order FastAPI calls them.</text>

  <text x="32" y="104" class="h">Production request</text>
  <rect x="32" y="116" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="54" cy="141" r="12" fill="#1c7c54"/>
  <text x="54" y="145" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">1</text>
  <text x="72" y="146" class="code">get_settings</text>
  <text x="48" y="170" class="note">returns Settings (env)</text>
  <rect x="244" y="116" width="180" height="70" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="266" cy="141" r="12" fill="#1c7c54"/>
  <text x="266" y="145" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">2</text>
  <text x="284" y="146" class="code">get_db</text>
  <text x="260" y="170" class="note">yields a DB session</text>
  <rect x="456" y="116" width="180" height="70" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="478" cy="141" r="12" fill="#1c7c54"/>
  <text x="478" y="145" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">3</text>
  <text x="496" y="146" class="code">get_current_user</text>
  <text x="472" y="170" class="note">returns the User</text>
  <rect x="668" y="116" width="180" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="690" cy="141" r="12" fill="#1c7c54"/>
  <text x="690" y="145" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">4</text>
  <text x="708" y="146" class="code">read_me</text>
  <text x="684" y="170" class="note">your route runs last</text>
  <line x1="214" y1="151" x2="241" y2="151" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="426" y1="151" x2="453" y2="151" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="638" y1="151" x2="665" y2="151" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="206" width="816" height="72" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="48" y="230" class="code">async def read_me(user: User = Depends(get_current_user)):</text>
  <text x="48" y="256" class="note">The route only names what it needs. FastAPI walks back through the chain, builds each piece once per request, and passes it in.</text>
  <text x="32" y="318" class="h">In tests: swap one node</text>
  <rect x="32" y="330" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="54" cy="355" r="12" fill="#1c7c54"/>
  <text x="54" y="359" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">1</text>
  <text x="72" y="360" class="code">get_settings</text>
  <text x="48" y="384" class="note">unchanged</text>
  <rect x="244" y="330" width="180" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="266" cy="355" r="12" fill="#1c7c54"/>
  <text x="266" y="359" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">2</text>
  <text x="284" y="360" class="code">fake_db</text>
  <text x="260" y="384" class="note">in-memory, no Postgres</text>
  <rect x="456" y="330" width="180" height="70" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="478" cy="355" r="12" fill="#1c7c54"/>
  <text x="478" y="359" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">3</text>
  <text x="496" y="360" class="code">get_current_user</text>
  <text x="472" y="384" class="note">unchanged</text>
  <rect x="668" y="330" width="180" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="690" cy="355" r="12" fill="#1c7c54"/>
  <text x="690" y="359" text-anchor="middle" style="font: 700 12px Inter, system-ui, sans-serif" fill="#ffffff">4</text>
  <text x="708" y="360" class="code">read_me</text>
  <text x="684" y="384" class="note">route code unchanged</text>
  <line x1="214" y1="365" x2="241" y2="365" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="426" y1="365" x2="453" y2="365" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="638" y1="365" x2="665" y2="365" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="420" width="816" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="444" class="code">app.dependency_overrides[get_db] = fake_db</text>
  <text x="48" y="464" class="note">One line in the test replaces the real database node; everything that depended on it now gets the fake.</text>

</svg>
