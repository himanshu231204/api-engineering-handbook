<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-labelledby="t d">
  <title id="t">The two halves of a RAG pipeline</title>
  <desc id="d">Top row, ingest: a document is uploaded, parsed to text, split into chunks, embedded into vectors and stored in a vector database. Bottom row, query: a question is embedded with the same model, the top 50 chunks are retrieved from the vector database, reranked down to 5, built into a prompt with sources, sent to the LLM, and returned as an answer with citations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="451" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">RAG in two rows: ingest once, query many times</text>
  <text x="32" y="66" class="sub">Documents are prepared ahead of time; questions are answered live using what was prepared.</text>
  <text x="32" y="104" class="h">INGEST — once per document, in the background</text>
  <rect x="32" y="118" width="136" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="100.0" cy="140" r="12" fill="#1c7c54"/>
  <text x="100.0" y="144" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="100.0" y="170" class="lbl" fill="#2563eb" text-anchor="middle">Upload</text>
  <text x="100.0" y="187" class="note" text-anchor="middle">file → storage</text>
  <line x1="171" y1="158.0" x2="199" y2="158.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="202" y="118" width="136" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="270.0" cy="140" r="12" fill="#1c7c54"/>
  <text x="270.0" y="144" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="270.0" y="170" class="lbl" fill="#b45309" text-anchor="middle">Parse</text>
  <text x="270.0" y="187" class="note" text-anchor="middle">extract text</text>
  <line x1="341" y1="158.0" x2="369" y2="158.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="372" y="118" width="136" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="440.0" cy="140" r="12" fill="#1c7c54"/>
  <text x="440.0" y="144" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="440.0" y="170" class="lbl" fill="#b45309" text-anchor="middle">Chunk</text>
  <text x="440.0" y="187" class="note" text-anchor="middle">split + overlap</text>
  <line x1="511" y1="158.0" x2="539" y2="158.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="542" y="118" width="136" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="610.0" cy="140" r="12" fill="#1c7c54"/>
  <text x="610.0" y="144" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="610.0" y="170" class="lbl" fill="#6d28d9" text-anchor="middle">Embed</text>
  <text x="610.0" y="187" class="note" text-anchor="middle">text → vectors</text>
  <line x1="681" y1="158.0" x2="709" y2="158.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="712" y="118" width="136" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="780.0" cy="140" r="12" fill="#1c7c54"/>
  <text x="780.0" y="144" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="780.0" y="170" class="lbl" fill="#475569" text-anchor="middle">Vector DB</text>
  <text x="780.0" y="187" class="note" text-anchor="middle">store + index</text>
  <text x="32" y="266" class="h">QUERY — every question</text>
  <rect x="32" y="280" width="96" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="80.0" cy="302" r="12" fill="#1c7c54"/>
  <text x="80.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="80.0" y="332" class="lbl" fill="#2563eb" text-anchor="middle">Question</text>
  <text x="80.0" y="349" class="note" text-anchor="middle">user asks</text>
  <line x1="130" y1="320.0" x2="150" y2="320.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="152" y="280" width="96" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="200.0" cy="302" r="12" fill="#1c7c54"/>
  <text x="200.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="200.0" y="332" class="lbl" fill="#6d28d9" text-anchor="middle">Embed</text>
  <text x="200.0" y="349" class="note" text-anchor="middle">same model</text>
  <line x1="250" y1="320.0" x2="270" y2="320.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="272" y="280" width="96" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="320.0" cy="302" r="12" fill="#1c7c54"/>
  <text x="320.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="320.0" y="332" class="lbl" fill="#475569" text-anchor="middle">Retrieve</text>
  <text x="320.0" y="349" class="note" text-anchor="middle">top-k = 50</text>
  <line x1="370" y1="320.0" x2="390" y2="320.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="392" y="280" width="96" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="440.0" cy="302" r="12" fill="#1c7c54"/>
  <text x="440.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="440.0" y="332" class="lbl" fill="#6d28d9" text-anchor="middle">Rerank</text>
  <text x="440.0" y="349" class="note" text-anchor="middle">keep best 5</text>
  <line x1="490" y1="320.0" x2="510" y2="320.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="512" y="280" width="96" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="560.0" cy="302" r="12" fill="#1c7c54"/>
  <text x="560.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="560.0" y="332" class="lbl" fill="#b45309" text-anchor="middle">Prompt</text>
  <text x="560.0" y="349" class="note" text-anchor="middle">adds sources</text>
  <line x1="610" y1="320.0" x2="630" y2="320.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="632" y="280" width="96" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="680.0" cy="302" r="12" fill="#1c7c54"/>
  <text x="680.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="680.0" y="332" class="lbl" fill="#6d28d9" text-anchor="middle">LLM</text>
  <text x="680.0" y="349" class="note" text-anchor="middle">writes answer</text>
  <line x1="730" y1="320.0" x2="750" y2="320.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="752" y="280" width="96" height="80" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="800.0" cy="302" r="12" fill="#1c7c54"/>
  <text x="800.0" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">7</text>
  <text x="800.0" y="332" class="lbl" fill="#1c7c54" text-anchor="middle">Answer</text>
  <text x="800.0" y="349" class="note" text-anchor="middle">with citations</text>
  <path d="M780.0,200 L780.0,236 L320.0,236 L320.0,277" fill="none" stroke="#475569" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="550.0" y="229" class="note" text-anchor="middle">retrieval searches the index built during ingest</text>
  <g transform="translate(32,384)">
    <rect width="816" height="48" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <rect x="16" y="16.0" width="16" height="16" rx="4" fill="#eff6ff" stroke="#2563eb"/>
    <text x="40" y="29.0" class="lbl" fill="#2563eb">Client</text>
    <rect x="140" y="16.0" width="16" height="16" rx="4" fill="#fef3c7" stroke="#b45309"/>
    <text x="164" y="29.0" class="lbl" fill="#b45309">Text / data</text>
    <rect x="300" y="16.0" width="16" height="16" rx="4" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="324" y="29.0" class="lbl" fill="#6d28d9">Model call</text>
    <rect x="460" y="16.0" width="16" height="16" rx="4" fill="#f1f5f9" stroke="#475569"/>
    <text x="484" y="29.0" class="lbl" fill="#475569">Storage</text>
    <rect x="600" y="16.0" width="16" height="16" rx="4" fill="#e8f5ee" stroke="#1c7c54"/>
    <text x="624" y="29.0" class="lbl" fill="#1c7c54">Result</text>
  </g>
  <text x="708" y="413" class="note">dashed = lookup</text>
</svg>
