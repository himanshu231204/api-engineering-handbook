<svg xmlns="http://www.w3.org/2000/svg" width="880" height="468" viewBox="0 0 880 468" role="img" aria-labelledby="t d">
  <title id="t">Retry timing: fixed delay vs exponential backoff vs exponential backoff with jitter</title>
  <desc id="d">Three clients fail at time zero and retry. With a fixed 2-second delay they retry together every 2 seconds, producing seven synchronized spikes. With exponential backoff they retry together at 1, 3, 7 and 15 seconds: fewer spikes, but still in lockstep. With exponential backoff plus full jitter each client waits a random part of the delay, so retries are spread out over time and the server sees a gentle trickle instead of a thundering herd.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

    <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="467" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Spacing out retries: fixed vs exponential vs + jitter</text>
  <text x="32" y="66" class="sub">Three clients (rows A, B, C) all fail at t = 0. Each dot is one retry hitting the server.</text>
  <rect x="32" y="88" width="816" height="74" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="48" y="112" class="lbl" fill="#b91c1c">Fixed delay</text>
  <text x="48" y="132" class="note">wait 2s every time</text>
  <text x="48" y="150" class="lbl" fill="#b91c1c">→ spikes forever</text>
  <line x1="214.0" y1="107" x2="821.5" y2="107" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="204.0" y="111" text-anchor="end" class="note">A</text>
  <line x1="214.0" y1="125" x2="821.5" y2="125" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="204.0" y="129" text-anchor="end" class="note">B</text>
  <line x1="214.0" y1="143" x2="821.5" y2="143" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="204.0" y="147" text-anchor="end" class="note">C</text>
  <rect x="285.0" y="96" width="20" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="366.0" y="96" width="20" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="447.0" y="96" width="20" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="528.0" y="96" width="20" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="609.0" y="96" width="20" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="690.0" y="96" width="20" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="771.0" y="96" width="20" height="58" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="295.0" cy="107" r="5" fill="#b91c1c"/>
