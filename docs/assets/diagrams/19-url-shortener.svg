<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">URL shortener: write path and read path</title>
  <desc id="d">Write path: the client posts a long URL, an ID generator hands out the next number, the number is base62-encoded into a 7-character code, and the code-to-URL row is saved in the database. Read path: the browser requests the short code, the redirect service checks the Redis cache, falls back to the database on a miss, and answers with a 302 redirect to the long URL while a click event is sent to a queue asynchronously.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="519" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">URL shortener: two very different paths</text>
  <text x="32" y="66" class="sub">Creating a link is rare and can be a bit slow. Following a link is ~100x more common and must be instant.</text>
  <text x="32" y="104" class="h">Write path — create a short link</text>
  <text x="848" y="104" class="note" text-anchor="end">~39 creations/s on average</text>
  <rect x="32" y="118" width="180" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="56" cy="144" r="12" fill="#1c7c54"/>
  <text x="56" y="148.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">1</text>
  <text x="76" y="149" class="lbl" fill="#2563eb">Client → API</text>
  <text x="48" y="176" class="code">POST /v1/links</text>
  <text x="48" y="197" class="note">validates the long URL</text>
  <line x1="214" y1="164.0" x2="242" y2="164.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="244" y="118" width="180" height="92" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="268" cy="144" r="12" fill="#1c7c54"/>
  <text x="268" y="148.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">2</text>
  <text x="288" y="149" class="lbl" fill="#475569">ID generator</text>
  <text x="260" y="176" class="code">n = 623935766164</text>
  <text x="260" y="197" class="note">next free number</text>
  <line x1="426" y1="164.0" x2="454" y2="164.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="456" y="118" width="180" height="92" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="480" cy="144" r="12" fill="#1c7c54"/>
  <text x="480" y="148.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">3</text>
  <text x="500" y="149" class="lbl" fill="#b45309">Base62 encode</text>
  <text x="472" y="176" class="code">→ aZ3kT9q</text>
  <text x="472" y="197" class="note">[0-9a-zA-Z], 7 chars</text>
  <line x1="638" y1="164.0" x2="666" y2="164.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="668" y="118" width="180" height="92" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="692" cy="144" r="12" fill="#1c7c54"/>
  <text x="692" y="148.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">4</text>
  <text x="712" y="149" class="lbl" fill="#1c7c54">Database</text>
  <text x="684" y="176" class="code">aZ3kT9q → URL</text>
  <text x="684" y="197" class="note">unique PK, warm cache</text>
  <text x="32" y="252" class="h">Read path — follow a short link (the hot path)</text>
  <text x="848" y="252" class="note" text-anchor="end">~1,500 redirects/s, p99 under 50 ms</text>
  <rect x="32" y="266" width="180" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="56" cy="292" r="12" fill="#1c7c54"/>
  <text x="56" y="296.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">1</text>
  <text x="76" y="297" class="lbl" fill="#2563eb">Browser</text>
  <text x="48" y="324" class="code">GET /aZ3kT9q</text>
  <text x="48" y="345" class="note">no auth, no JSON</text>
  <rect x="244" y="266" width="180" height="92" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="268" cy="292" r="12" fill="#1c7c54"/>
  <text x="268" y="296.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">2</text>
  <text x="288" y="297" class="lbl" fill="#1c7c54">Redirect service</text>
  <text x="260" y="324" class="code">lookup code</text>
  <text x="260" y="345" class="note">stateless, many copies</text>
  <rect x="456" y="266" width="180" height="92" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="480" cy="292" r="12" fill="#1c7c54"/>
  <text x="480" y="296.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">3</text>
  <text x="500" y="297" class="lbl" fill="#b45309">Redis cache</text>
  <text x="472" y="324" class="code">hit: &lt; 1 ms</text>
  <text x="472" y="345" class="note">serves ~80%+ of reads</text>
  <rect x="668" y="266" width="180" height="92" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="692" cy="292" r="12" fill="#1c7c54"/>
  <text x="692" y="296.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">4</text>
  <text x="712" y="297" class="lbl" fill="#475569">Database</text>
  <text x="684" y="324" class="code">read replica</text>
  <text x="684" y="345" class="note">only on a cache miss</text>
  <line x1="214" y1="312.0" x2="242" y2="312.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="426" y1="312.0" x2="454" y2="312.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="638" y1="312.0" x2="666" y2="312.0" stroke="#475569" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M294,360 V392 H122.0 V362" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="140" cy="412" r="12" fill="#1c7c54"/>
  <text x="140" y="416.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">5</text>
  <text x="160" y="417" class="code">302 Found → long URL</text>
  <path d="M384,360 V408 H454" fill="none" stroke="#475569" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="456" y="384" width="392" height="50" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="480" cy="409" r="12" fill="#1c7c54"/>
  <text x="480" y="413.5" text-anchor="middle" style="font: 700 12px Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff;">6</text>
  <text x="500" y="405" class="lbl" fill="#475569">Click event → queue → analytics</text>
  <text x="500" y="423" class="note">fire-and-forget: never slows the redirect</text>
  <rect x="32" y="456" width="816" height="40" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="48" y="481" class="lbl" fill="#1c7c54">Why 302, not 301?</text>
  <text x="184" y="481" class="note">Browsers remember a 301 forever, so you could never disable or change the link later.</text>
</svg>
