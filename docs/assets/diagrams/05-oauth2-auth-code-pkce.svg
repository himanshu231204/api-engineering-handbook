<svg xmlns="http://www.w3.org/2000/svg" width="880" height="628" viewBox="0 0 880 628" role="img" aria-labelledby="t d">
  <title id="t">OAuth 2.0 Authorization Code flow with PKCE</title>
  <desc id="d">Numbered sequence: the client creates a code_verifier and a code_challenge, sends the user to the authorization server with the challenge, the user logs in and consents, the authorization server redirects back with a one-time code, the client posts the code plus the verifier to the token endpoint, the server checks that SHA256 of the verifier equals the challenge, returns access and refresh tokens, and the client calls the API with the access token as a bearer token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

    <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="627" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">OAuth 2.0: Authorization Code + PKCE</text>
  <text x="32" y="66" class="sub">The app gets a scoped, revocable token without ever seeing the user's password. Follow the numbers.</text>
  <line x1="122" y1="134" x2="122" y2="536" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="342" y1="134" x2="342" y2="536" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="572" y1="134" x2="572" y2="536" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="780" y1="134" x2="780" y2="536" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="32" y="86" width="180" height="48" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="122" y="106" text-anchor="middle" class="h">User</text>
  <text x="122" y="124" text-anchor="middle" class="note">in a browser</text>
  <rect x="252" y="86" width="180" height="48" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="342" y="106" text-anchor="middle" class="h">Client app</text>
  <text x="342" y="124" text-anchor="middle" class="note">e.g. a scheduler</text>
  <rect x="462" y="86" width="220" height="48" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="572" y="106" text-anchor="middle" class="h">Authorization server</text>
  <text x="572" y="124" text-anchor="middle" class="note">login, consent, tokens</text>
  <rect x="712" y="86" width="136" height="48" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="780" y="106" text-anchor="middle" class="h">API</text>
  <text x="780" y="124" text-anchor="middle" class="note">resource server</text>
  <rect x="252" y="148" width="180" height="50" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="234" cy="173" r="12" fill="#1c7c54"/>
  <text x="234" y="177" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="264" y="168" class="note">Make a secret code_verifier</text>
  <text x="264" y="186" class="note">+ challenge = SHA256(it)</text>
  <line x1="342" y1="232" x2="568" y2="232" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="362" cy="217" r="12" fill="#1c7c54"/>
  <text x="362" y="221" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="380" y="222" class="note">Redirect to /authorize + challenge</text>
  <line x1="122" y1="274" x2="568" y2="274" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="142" cy="259" r="12" fill="#1c7c54"/>
  <text x="142" y="263" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="160" y="264" class="note">User logs in and approves the requested scope</text>
  <line x1="572" y1="316" x2="346" y2="316" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="362" cy="301" r="12" fill="#1c7c54"/>
  <text x="362" y="305" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="380" y="306" class="note">Redirect back with one-time ?code=</text>
  <line x1="342" y1="358" x2="568" y2="358" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="362" cy="343" r="12" fill="#1c7c54"/>
  <text x="362" y="347" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="380" y="348" class="note">POST /token: code + code_verifier</text>
  <rect x="462" y="374" width="220" height="40" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="446" cy="394" r="12" fill="#1c7c54"/>
  <text x="446" y="398" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="572" y="398" text-anchor="middle" class="note">SHA256(verifier) == challenge?</text>
  <line x1="572" y1="450" x2="346" y2="450" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="362" cy="435" r="12" fill="#1c7c54"/>
  <text x="362" y="439" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">7</text>
  <text x="380" y="440" class="note">access_token + refresh_token</text>
  <line x1="342" y1="492" x2="776" y2="492" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="362" cy="477" r="12" fill="#1c7c54"/>
  <text x="362" y="481" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">8</text>
  <text x="380" y="482" class="note">GET /calendar   Authorization: Bearer access_token</text>
  <line x1="780" y1="526" x2="346" y2="526" stroke="#475569" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="362" y="516" class="note">200 OK + calendar data</text>
  <g transform="translate(32,556)">
    <rect width="816" height="48" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="16" y="29" class="lbl" fill="#1c7c54">Why PKCE?</text>
    <text x="100" y="29" class="note">A code stolen in step 4 is useless: redeeming it in step 5 needs the verifier, which never left the client.</text>
  </g>
</svg>
