<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">A timeout budget shrinking across a call chain</title>
  <desc id="d">A request has a 6 second end-to-end deadline. The gateway spends 0.3 seconds on its own work, leaving 5.7 seconds. Service A spends 0.5 seconds, leaving 5.2. Service B spends 0.7 seconds, leaving 4.5. The database call must finish within the 4.5 seconds that remain, and in practice gets a tighter limit of 2 seconds. Each hop sets its timeout to less than the time left and passes the remaining budget downstream, so the whole chain fails fast instead of every layer waiting its own full timeout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

    <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="519" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Timeout budget: one deadline, shrinking at every hop</text>
  <text x="32" y="66" class="sub">The user gives you 6 seconds in total. Each hop spends some and passes on only what is left.</text>
  <text x="200" y="98" class="note">0 s</text>
  <text x="800" y="98" text-anchor="end" class="note">6 s deadline</text>
  <text x="32" y="130" class="h">API Gateway</text>
  <text x="32" y="148" class="note">public entry</text>
  <rect x="200" y="118" width="600" height="34" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="200.0" y="118" width="30.0" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="238.0" y="139" class="lbl" fill="#2563eb">own work 0.3 s → 5.7 s left</text>
  <line x1="230.0" y1="152" x2="230.0" y2="180" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="32" y="196" class="h">Service A</text>
  <text x="32" y="214" class="note">business logic</text>
  <rect x="200" y="184" width="600" height="34" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="200" y="184" width="30.0" height="34" rx="8" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.25"/>
  <rect x="230.0" y="184" width="50.0" height="34" rx="6" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="288.0" y="205" class="lbl" fill="#1c7c54">own work 0.5 s → 5.2 s left</text>
  <line x1="280.0" y1="218" x2="280.0" y2="246" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="32" y="262" class="h">Service B</text>
  <text x="32" y="280" class="note">business logic</text>
  <rect x="200" y="250" width="600" height="34" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="200" y="250" width="80.0" height="34" rx="8" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.25"/>
  <rect x="280.0" y="250" width="70.0" height="34" rx="6" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="358.0" y="271" class="lbl" fill="#1c7c54">own work 0.7 s → 4.5 s left</text>
  <line x1="350.0" y1="284" x2="350.0" y2="312" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="32" y="328" class="h">Database</text>
  <text x="32" y="346" class="note">query</text>
  <rect x="200" y="316" width="600" height="34" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="200" y="316" width="150.0" height="34" rx="8" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.25"/>
  <rect x="350.0" y="316" width="100.0" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="458.0" y="337" class="lbl" fill="#475569">expected ~1 s; timeout set to 2 s</text>
  <line x1="800" y1="102" x2="800" y2="364" stroke="#b91c1c" stroke-width="1.75" stroke-dasharray="5 4"/>
  <g transform="translate(32,382)">
    <rect width="816" height="112" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="16" y="26" class="lbl" fill="#1c7c54">How to apply it</text>
    <text x="16" y="50" class="note">1. Each hop sets its own timeout to LESS than the time left, so it can still answer its caller.</text>
    <text x="16" y="70" class="note">2. Pass the remaining budget downstream (header or context deadline); stop early if it is already spent.</text>
    <text x="16" y="90" class="note">3. Retries spend budget too: 3 tries × 2 s each is 6 s, the whole deadline. Never give every layer a full 6 s.</text>
  </g>
</svg>
