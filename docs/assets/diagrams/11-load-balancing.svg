<svg xmlns="http://www.w3.org/2000/svg" width="880" height="468" viewBox="0 0 880 468" role="img" aria-labelledby="t d">
  <title id="t">Load balancing algorithms compared</title>
  <desc id="d">Three load balancing algorithms side by side. Round-robin sends requests to servers in turn and suits equal servers with similar requests. Least connections sends each request to the server with the fewest open connections and suits long or uneven requests. Consistent hashing maps a key such as a user id to the same server and suits caches, and adding a server moves only a small share of keys.</desc>
  <defs>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="467" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Load balancing: three ways to pick a server</text>
  <text x="32" y="66" class="sub">The algorithm decides which instance gets the next request. Pick by what your requests look like.</text>

  <rect x="32" y="86" width="264" height="352" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="112" class="h" fill="#2563eb">Round-robin</text>
  <text x="48" y="131" class="note">take turns, A then B then C</text>
  <rect x="48" y="146" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="60" y="170" class="lbl" fill="#475569">Server A</text>
  <text x="144" y="170" class="code">requests 1, 4</text>
  <rect x="48" y="192" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="60" y="216" class="lbl" fill="#475569">Server B</text>
  <text x="144" y="216" class="code">requests 2, 5</text>
  <rect x="48" y="238" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="60" y="262" class="lbl" fill="#475569">Server C</text>
  <text x="144" y="262" class="code">requests 3, 6</text>
  <text x="48" y="312" class="lbl" fill="#1c7c54">Good for</text>
  <text x="48" y="332" class="note">equal servers, similar requests</text>
  <text x="48" y="350" class="note">simplest, no shared state</text>
  <text x="48" y="378" class="lbl" fill="#b91c1c">Watch out</text>
  <text x="48" y="398" class="note">ignores how busy a server is</text>
  <text x="48" y="416" class="note">one slow request stalls its queue</text>
  <rect x="308" y="86" width="264" height="352" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="324" y="112" class="h" fill="#1c7c54">Least connections</text>
  <text x="324" y="131" class="note">send to the least busy server</text>
  <rect x="324" y="146" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="336" y="170" class="lbl" fill="#475569">Server A</text>
  <text x="420" y="170" class="code">12 open</text>
  <rect x="324" y="192" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="336" y="216" class="lbl" fill="#475569">Server B</text>
  <text x="420" y="216" class="code">3 open  (next)</text>
  <rect x="324" y="238" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="336" y="262" class="lbl" fill="#475569">Server C</text>
  <text x="420" y="262" class="code">9 open</text>
  <text x="324" y="312" class="lbl" fill="#1c7c54">Good for</text>
  <text x="324" y="332" class="note">long or uneven requests</text>
  <text x="324" y="350" class="note">streams, uploads, LLM calls</text>
  <text x="324" y="378" class="lbl" fill="#b91c1c">Watch out</text>
  <text x="324" y="398" class="note">new server gets flooded at first</text>
  <text x="324" y="416" class="note">each LB only counts its own view</text>
  <rect x="584" y="86" width="264" height="352" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="600" y="112" class="h" fill="#b45309">Consistent hashing</text>
  <text x="600" y="131" class="note">same key, same server</text>
  <rect x="600" y="146" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="612" y="170" class="lbl" fill="#475569">Server A</text>
  <text x="696" y="170" class="code">users 17, 42</text>
  <rect x="600" y="192" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="612" y="216" class="lbl" fill="#475569">Server B</text>
  <text x="696" y="216" class="code">user 8</text>
  <rect x="600" y="238" width="232" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.25"/>
  <text x="612" y="262" class="lbl" fill="#475569">Server C</text>
  <text x="696" y="262" class="code">users 31, 55</text>
  <text x="600" y="312" class="lbl" fill="#1c7c54">Good for</text>
  <text x="600" y="332" class="note">caches and per-key local state</text>
  <text x="600" y="350" class="note">adding a node moves few keys</text>
  <text x="600" y="378" class="lbl" fill="#b91c1c">Watch out</text>
  <text x="600" y="398" class="note">a hot key overloads one node</text>
  <text x="600" y="416" class="note">needs virtual nodes to balance</text>
  <text x="32" y="458" class="note">Whichever you choose, pair it with health checks so a dead server leaves the pool.</text>
</svg>
