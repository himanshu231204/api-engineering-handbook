  <circle cx="56" cy="110" r="12" fill="#1c7c54"/><text x="56" y="114.5" text-anchor="middle" class="num">1</text>
  <text x="78" y="115" class="h" fill="#1c7c54">Foundations</text>
  <text x="832" y="115" text-anchor="end" class="note">Build a working API backed by a database</text>
  <rect x="48" y="128" width="144" height="52" rx="10" fill="#ffffff" stroke="#1c7c54" stroke-width="1.5"/>
