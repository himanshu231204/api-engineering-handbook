<svg xmlns="http://www.w3.org/2000/svg" width="880" height="684" viewBox="0 0 880 684" role="img" aria-labelledby="t d">
  <title id="t">The learning path: 20 parts in 4 tracks</title>
  <desc id="d">Foundations (parts 0 to 4), then Backend in Production (parts 5 to 13), then AI Engineering (parts 14 to 17), then Architecture and Design (parts 18 to 20). Each track builds on the one before.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 700 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pn    { font: 700 12px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
      .note  { font: 400 12.5px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .num   { font: 700 12px Inter, system-ui, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="683" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">The learning path</text>
  <text x="32" y="66" class="sub">20 parts in 4 tracks. Each track assumes the one above it — an LLM API is still an HTTP API.</text>
