  <text x="222" y="169" class="lbl">HTTP Foundations</text>
  <line x1="354" y1="154.0" x2="366" y2="154.0" stroke="#1c7c54" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="368" y="128" width="144" height="52" rx="10" fill="#ffffff" stroke="#1c7c54" stroke-width="1.5"/>
