<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">One request end to end: POST /orders</title>
  <desc id="d">A POST /orders request goes from the client through DNS, the CDN, the load balancer and the API gateway to the order service, which commits to PostgreSQL, updates Redis and publishes an order.created message to a queue before returning 201 Created in roughly 20 to 150 milliseconds. A worker processes the message after the response. Each box notes its typical latency and how it can fail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">One request, end to end: POST /orders</text>
  <text x="32" y="66" class="sub">Follow the numbers. Grey = typical time spent there; red = what can go wrong at that hop.</text>
  <rect x="32" y="90" width="148" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="52" cy="112" r="12" fill="#1c7c54"/>
  <text x="52" y="116" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="70" y="117" class="lbl" fill="#2563eb">Client</text>
  <text x="44" y="140" class="note">sends HTTPS request</text>
  <text x="44" y="174" class="note" fill="#6b7280">~0 ms</text>
  <text x="44" y="189" class="note" fill="#b91c1c">network drop → retry</text>
  <line x1="181" y1="142.0" x2="197" y2="142.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="199" y="90" width="148" height="114" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="219" cy="112" r="12" fill="#1c7c54"/>
  <text x="219" y="116" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="237" y="117" class="lbl" fill="#475569">DNS</text>
  <text x="211" y="140" class="note">name → IP address</text>
  <text x="211" y="174" class="note" fill="#6b7280">~1–50 ms (cached)</text>
  <text x="211" y="189" class="note" fill="#b91c1c">stale record, outage</text>
  <line x1="348" y1="142.0" x2="364" y2="142.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="366" y="90" width="148" height="114" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="386" cy="112" r="12" fill="#1c7c54"/>
  <text x="386" y="116" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="404" y="117" class="lbl" fill="#475569">CDN edge</text>
  <text x="378" y="140" class="note">POST not cached,</text>
  <text x="378" y="156" class="note">passes straight through</text>
  <text x="378" y="174" class="note" fill="#6b7280">+1–5 ms</text>
  <text x="378" y="189" class="note" fill="#b91c1c">edge PoP down</text>
  <line x1="515" y1="142.0" x2="531" y2="142.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="533" y="90" width="148" height="114" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="553" cy="112" r="12" fill="#1c7c54"/>
  <text x="553" y="116" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="571" y="117" class="lbl" fill="#475569">Load balancer</text>
  <text x="545" y="140" class="note">TLS, pick healthy</text>
  <text x="545" y="156" class="note">gateway instance</text>
  <text x="545" y="174" class="note" fill="#6b7280">+1–2 ms</text>
  <text x="545" y="189" class="note" fill="#b91c1c">unhealthy targets</text>
  <line x1="682" y1="142.0" x2="698" y2="142.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="700" y="90" width="148" height="114" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="720" cy="112" r="12" fill="#1c7c54"/>
  <text x="720" y="116" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="738" y="117" class="lbl" fill="#1c7c54">API gateway</text>
  <text x="712" y="140" class="note">auth, rate limit,</text>
  <text x="712" y="156" class="note">trace ID, routing</text>
  <text x="712" y="174" class="note" fill="#6b7280">+2–10 ms</text>
  <text x="712" y="189" class="note" fill="#b91c1c">401 / 429 here</text>
  <line x1="774" y1="205" x2="774" y2="232" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="700" y="236" width="148" height="114" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <circle cx="720" cy="258" r="12" fill="#1c7c54"/>
  <text x="720" y="262" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="738" y="263" class="lbl" fill="#1c7c54">Order service</text>
  <text x="712" y="286" class="note">validate body,</text>
  <text x="712" y="302" class="note">run the handler</text>
  <text x="712" y="320" class="note" fill="#6b7280">+1–5 ms CPU</text>
  <text x="712" y="335" class="note" fill="#b91c1c">crash → LB reroutes</text>
  <rect x="533" y="236" width="148" height="114" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="553" cy="258" r="12" fill="#1c7c54"/>
  <text x="553" y="262" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">7</text>
  <text x="571" y="263" class="lbl" fill="#b45309">PostgreSQL</text>
  <text x="545" y="286" class="note">one transaction:</text>
  <text x="545" y="302" class="note">insert + commit</text>
  <text x="545" y="320" class="note" fill="#6b7280">+5–100 ms (most)</text>
  <text x="545" y="335" class="note" fill="#b91c1c">down → fast 503</text>
  <line x1="698" y1="288.0" x2="683" y2="288.0" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="366" y="236" width="148" height="114" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="386" cy="258" r="12" fill="#1c7c54"/>
  <text x="386" y="262" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">8</text>
  <text x="404" y="263" class="lbl" fill="#b45309">Redis cache</text>
  <text x="378" y="286" class="note">update or invalidate</text>
  <text x="378" y="302" class="note">order key</text>
  <text x="378" y="320" class="note" fill="#6b7280">under 1 ms</text>
  <text x="378" y="335" class="note" fill="#b91c1c">down → slower reads</text>
  <rect x="199" y="236" width="148" height="114" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="219" cy="258" r="12" fill="#1c7c54"/>
  <text x="219" y="262" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">9</text>
  <text x="237" y="263" class="lbl" fill="#475569">Queue</text>
  <text x="211" y="286" class="note">publish</text>
  <text x="211" y="302" class="note">order.created</text>
  <text x="211" y="320" class="note" fill="#6b7280">+1–5 ms</text>
  <text x="211" y="335" class="note" fill="#b91c1c">backlog → late email</text>
  <rect x="32" y="236" width="148" height="114" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="52" cy="258" r="12" fill="#1c7c54"/>
  <text x="52" y="262" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">10</text>
  <text x="72" y="263" class="lbl" fill="#6d28d9">Worker</text>
  <text x="44" y="286" class="note">email, analytics —</text>
  <text x="44" y="302" class="note">after the response</text>
  <text x="44" y="320" class="note" fill="#6b7280">seconds, async</text>
  <text x="44" y="335" class="note" fill="#b91c1c">retries / dead-letter</text>
  <path d="M740,350 V370 H440 V353" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M808,350 V392 H273 V353" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="560" y="366" class="note">then update cache</text>
  <text x="560" y="388" class="note">then publish the side-effect message</text>
  <line x1="197" y1="288.0" x2="183" y2="288.0" stroke="#475569" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="32" y="412" width="816" height="64" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="48" y="436" class="lbl" fill="#1c7c54">Response: 201 Created retraces the path back to the client — total ≈ 20–150 ms, mostly the database round trip.</text>
  <text x="48" y="458" class="note">Step 10 is never on the clock: the client already has its answer. Anything that need not block the reply goes on the queue.</text>
  <rect x="32" y="490" width="816" height="54" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="512" class="lbl" fill="#475569">Where to look when it’s slow:</text>
  <text x="240" y="512" class="note">one trace ID from the gateway follows the request through every hop,</text>
  <text x="48" y="532" class="note">so you can see whether time went to the edge, the gateway, the service or the database.</text>
</svg>
