<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="t d">
  <title id="t">API gateway: one front door for many services</title>
  <desc id="d">Web, mobile and partner clients all call one API gateway. The gateway terminates TLS, authenticates the caller, applies rate limits using shared counters in Redis, and routes each request by path prefix to the orders, payments, inventory or users service. Bad tokens get 401 and over-quota callers get 429 before any service does work. Services stay private behind the gateway.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">API gateway: one front door</text>
  <text x="32" y="66" class="sub">Clients see one address. The gateway does the shared chores once, then forwards to the right service.</text>
  <rect x="32" y="124" width="168" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="150" class="lbl" fill="#2563eb">Web app</text>
  <text x="48" y="170" class="note">browser</text>
  <line x1="200" y1="155" x2="268" y2="155" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="216" width="168" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="242" class="lbl" fill="#2563eb">Mobile app</text>
  <text x="48" y="262" class="note">iOS / Android</text>
  <line x1="200" y1="247" x2="268" y2="247" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="308" width="168" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="334" class="lbl" fill="#2563eb">Partner</text>
  <text x="48" y="354" class="note">third-party API client</text>
  <line x1="200" y1="339" x2="268" y2="339" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="32" y="108" class="h">Clients</text>
  <text x="272" y="108" class="h">API gateway</text>
  <rect x="272" y="120" width="300" height="264" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <rect x="288" y="136" width="268" height="50" rx="8" fill="#ffffff" stroke="#1c7c54" stroke-width="1.2"/>
  <circle cx="310" cy="161" r="12" fill="#1c7c54"/>
  <text x="310" y="165" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="332" y="157" class="lbl" fill="#111827">TLS termination</text>
  <text x="332" y="175" class="note">decrypt HTTPS once, at the edge</text>
  <rect x="288" y="196" width="268" height="50" rx="8" fill="#ffffff" stroke="#1c7c54" stroke-width="1.2"/>
  <circle cx="310" cy="221" r="12" fill="#1c7c54"/>
  <text x="310" y="225" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="332" y="217" class="lbl" fill="#111827">Authenticate</text>
  <text x="332" y="235" class="note">validate bearer token / API key</text>
  <rect x="288" y="256" width="268" height="50" rx="8" fill="#ffffff" stroke="#1c7c54" stroke-width="1.2"/>
  <circle cx="310" cy="281" r="12" fill="#1c7c54"/>
  <text x="310" y="285" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="332" y="277" class="lbl" fill="#111827">Rate limit</text>
  <text x="332" y="295" class="note">per-client quota, counters in Redis</text>
  <rect x="288" y="316" width="268" height="50" rx="8" fill="#ffffff" stroke="#1c7c54" stroke-width="1.2"/>
  <circle cx="310" cy="341" r="12" fill="#1c7c54"/>
  <text x="310" y="345" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="332" y="337" class="lbl" fill="#111827">Route by path</text>
  <text x="332" y="355" class="note">/orders/* → Orders service</text>
  <line x1="342" y1="384" x2="342" y2="410" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="502" y1="384" x2="502" y2="410" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="272" y="412" width="140" height="52" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="286" y="434" class="lbl" fill="#b91c1c">401 Unauthorized</text>
  <text x="286" y="452" class="note">bad or missing token</text>
  <rect x="432" y="412" width="140" height="52" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="446" y="434" class="lbl" fill="#b91c1c">429 Too Many</text>
  <text x="446" y="452" class="note">over quota</text>
  <text x="272" y="486" class="note">Rejected at the edge — no service does any work.</text>
  <text x="660" y="108" class="h">Private services</text>
  <rect x="660" y="120" width="188" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="676" y="144" class="lbl" fill="#475569">Orders service</text>
  <text x="676" y="163" class="code">/orders/*</text>
  <line x1="572" y1="252" x2="656" y2="148" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="660" y="190" width="188" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="676" y="214" class="lbl" fill="#475569">Payments service</text>
  <text x="676" y="233" class="code">/payments/*</text>
  <line x1="572" y1="252" x2="656" y2="218" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="660" y="260" width="188" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="676" y="284" class="lbl" fill="#475569">Inventory service</text>
  <text x="676" y="303" class="code">/inventory/*</text>
  <line x1="572" y1="252" x2="656" y2="288" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="660" y="330" width="188" height="56" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="676" y="354" class="lbl" fill="#475569">Users service</text>
  <text x="676" y="373" class="code">/users/*</text>
  <line x1="572" y1="252" x2="656" y2="358" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="660" y="418" class="note">Can move, split or merge —</text>
  <text x="660" y="436" class="note">clients never notice.</text>
  <rect x="32" y="504" width="816" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="529" class="note" fill="#1f2937">Keep it dumb: route and protect traffic only. Business rules (order totals, refunds) belong in the services.</text>
</svg>
