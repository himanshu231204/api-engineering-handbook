<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">Circuit breaker state machine: closed, open, half-open</title>
  <desc id="d">A circuit breaker starts CLOSED, letting calls through and counting failures. When failures reach the threshold it trips to OPEN, where every call fails fast and a fallback is served. After a cooldown it moves to HALF-OPEN and lets a single trial call through. If the trial succeeds it returns to CLOSED; if the trial fails it goes back to OPEN and restarts the cooldown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

    <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="519" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Circuit breaker: three states, four transitions</text>
  <text x="32" y="66" class="sub">Follow the numbers: trip on failures, wait, test carefully, then either recover or wait again.</text>
  <rect x="64" y="112" width="240" height="96" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="184" y="140" text-anchor="middle" class="h">CLOSED</text>
  <text x="184" y="164" text-anchor="middle" class="note">Normal: calls go through.</text>
  <text x="184" y="184" text-anchor="middle" class="note">Count recent failures.</text>
  <rect x="576" y="112" width="240" height="96" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="696" y="140" text-anchor="middle" class="h">OPEN</text>
  <text x="696" y="164" text-anchor="middle" class="note">Fail fast (~1 ms): no call made.</text>
  <text x="696" y="184" text-anchor="middle" class="note">Serve a fallback instead.</text>
  <rect x="320" y="316" width="240" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="440" y="344" text-anchor="middle" class="h">HALF-OPEN</text>
  <text x="440" y="368" text-anchor="middle" class="note">Let ONE trial call through;</text>
  <text x="440" y="388" text-anchor="middle" class="note">reject the rest for now.</text>
  <line x1="304" y1="146" x2="572" y2="146" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="340" cy="128" r="12" fill="#1c7c54"/>
  <text x="340" y="132" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="360" y="133" class="lbl" fill="#b91c1c">failures ≥ threshold (e.g. 5)</text>
  <line x1="640" y1="208" x2="544" y2="312" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="618" cy="262" r="12" fill="#1c7c54"/>
  <text x="618" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="638" y="267" class="lbl" fill="#b45309">cooldown ends</text>
  <text x="638" y="285" class="note">(e.g. 30 s)</text>
  <line x1="336" y1="316" x2="236" y2="212" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="260" cy="272" r="12" fill="#1c7c54"/>
  <text x="260" y="276" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="236" y="267" text-anchor="end" class="lbl" fill="#1c7c54">trial succeeds</text>
  <text x="236" y="285" text-anchor="end" class="note">reset the count</text>
  <path d="M560 380 C 700 380, 760 330, 760 212" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <circle cx="600" cy="404" r="12" fill="#1c7c54"/>
  <text x="600" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="620" y="409" class="lbl" fill="#b91c1c">trial fails</text>
  <text x="682" y="409" class="note">→ restart the cooldown</text>
  <g transform="translate(32,444)">
    <rect width="816" height="48" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="16" y="29" class="lbl" fill="#1c7c54">Why half-open?</text>
    <text x="132" y="29" class="note">It tests recovery with a trickle, not a flood — so the check itself can't knock the dependency over again.</text>
  </g>
</svg>
