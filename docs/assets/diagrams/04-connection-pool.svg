<svg xmlns="http://www.w3.org/2000/svg" width="880" height="564" viewBox="0 0 880 564" role="img" aria-labelledby="t d">
  <title id="t">Database connection pool</title>
  <desc id="d">Four requests borrow the pool's three steady connections plus one overflow connection; further requests wait in a queue and fail with a 503 after pool_timeout. All pools across processes must fit under PostgreSQL's max_connections.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 20px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .sub   { font: 400 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
      .h     { font: 600 15px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
      .lbl   { font: 600 13px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .note  { font: 400 12px Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
      .code  { font: 500 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; fill: #1f2937; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="879" height="563" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="44" class="title">Connection pooling: borrow, use, give back</text>
  <text x="32" y="66" class="sub">Opening a connection is slow, so a few stay open and requests take turns using them.</text>

  <text x="32" y="112" class="lbl" fill="#2563eb">Requests</text>
  <rect x="32" y="132" width="150" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="155" class="lbl" fill="#111827">Request 1</text>
  <rect x="32" y="180" width="150" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="203" class="lbl" fill="#111827">Request 2</text>
  <rect x="32" y="228" width="150" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="251" class="lbl" fill="#111827">Request 3</text>
  <rect x="32" y="276" width="150" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="299" class="lbl" fill="#111827">Request 4</text>
  <rect x="250" y="96" width="360" height="234" rx="12" fill="#ffffff" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="266" y="118" class="lbl" fill="#1c7c54">Connection pool (one per app process)</text>
  <rect x="270" y="132" width="180" height="36" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="286" y="155" class="code">conn 1  in use</text>
  <rect x="270" y="180" width="180" height="36" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="286" y="203" class="code">conn 2  in use</text>
  <rect x="270" y="228" width="180" height="36" rx="10" fill="#e8f5ee" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="286" y="251" class="code">conn 3  in use</text>
  <rect x="270" y="276" width="180" height="36" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="286" y="299" class="code">extra  in use</text>
  <line x1="184" y1="150" x2="267" y2="150" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="184" y1="198" x2="267" y2="198" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="184" y1="246" x2="267" y2="246" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="184" y1="294" x2="267" y2="294" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="462" y1="136" x2="462" y2="260" stroke="#1c7c54" stroke-width="1.5"/>
  <line x1="462" y1="136" x2="456" y2="136" stroke="#1c7c54" stroke-width="1.5"/>
  <line x1="462" y1="260" x2="456" y2="260" stroke="#1c7c54" stroke-width="1.5"/>
  <text x="472" y="194" class="code">pool_size = 3</text>
  <text x="472" y="214" class="note">always open</text>
  <text x="472" y="292" class="code">max_overflow = 1</text>
  <text x="472" y="310" class="note">burst only</text>
  <rect x="680" y="150" width="168" height="128" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="696" y="178" class="h">PostgreSQL</text>
  <text x="696" y="202" class="note">max_connections = 100</text>
  <text x="696" y="222" class="note">shared by every app</text>
  <text x="696" y="240" class="note">process, worker and</text>
  <text x="696" y="258" class="note">admin tool</text>
  <line x1="612" y1="214" x2="677" y2="214" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="32" y="362" width="360" height="84" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="384" class="lbl" fill="#b45309">Waiting queue (every connection busy)</text>
  <rect x="48" y="398" width="100" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="62" y="420" class="lbl" fill="#111827">Request 5</text>
  <rect x="160" y="398" width="100" height="34" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="174" y="420" class="lbl" fill="#111827">Request 6</text>
  <text x="276" y="420" class="h">…</text>
  <line x1="320" y1="360" x2="320" y2="333" stroke="#475569" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="332" y="352" class="note">waits for a returned connection</text>
  <line x1="394" y1="404" x2="419" y2="404" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="422" y="362" width="426" height="84" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="438" y="386" class="lbl" fill="#b91c1c">Still waiting after pool_timeout?</text>
  <text x="438" y="408" class="note">The request fails (503 “pool exhausted”) before</text>
  <text x="438" y="426" class="note">it reaches the database, which may be perfectly fine.</text>
  <rect x="32" y="470" width="816" height="62" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="48" y="494" class="code">processes × (pool_size + max_overflow) ≤ max_connections − headroom</text>
  <text x="48" y="516" class="note">Example: 4 × (15 + 5) = 80 ≤ 100 − 20 reserved for workers, migrations and admin tools.</text>

</svg>
